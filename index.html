<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個人屬性面板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">

<style>
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --surface-3:#E8EDEC;
  --ink:#14191A; --ink-2:#485052; --muted:#788384; --rule:#D9DFDE; --rule-2:#E9EEED;
  --hw:#A85A12; --hw-fill:rgba(168,90,18,.13); --hw-line:rgba(168,90,18,.34);
  --sw:#0A6E9B; --sw-fill:rgba(10,110,155,.13); --sw-line:rgba(10,110,155,.34);
  --shadow:0 1px 2px rgba(20,25,26,.05), 0 8px 24px -12px rgba(20,25,26,.18);
  --f-display:"Noto Serif TC", Georgia, "Songti TC", serif;
  --f-body:"Noto Sans TC", -apple-system, "Microsoft JhengHei", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --f-cjk:"Noto Sans TC", -apple-system, "Microsoft JhengHei", sans-serif;
}
:root[data-l="en"]{
  --f-display:"Newsreader", Georgia, serif;
  --f-body:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101314; --surface:#181C1D; --surface-2:#1E2324; --surface-3:#252B2C;
    --ink:#E8ECEB; --ink-2:#A4AEAE; --muted:#778182; --rule:#2A3132; --rule-2:#232A2B;
    --hw:#C4832E; --hw-fill:rgba(196,131,46,.16); --hw-line:rgba(196,131,46,.40);
    --sw:#2795BD; --sw-fill:rgba(39,149,189,.16); --sw-line:rgba(39,149,189,.40);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#101314; --surface:#181C1D; --surface-2:#1E2324; --surface-3:#252B2C;
  --ink:#E8ECEB; --ink-2:#A4AEAE; --muted:#778182; --rule:#2A3132; --rule-2:#232A2B;
  --hw:#C4832E; --hw-fill:rgba(196,131,46,.16); --hw-line:rgba(196,131,46,.40);
  --sw:#2795BD; --sw-fill:rgba(39,149,189,.16); --sw-line:rgba(39,149,189,.40);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
.langbar{
  position:fixed; right:16px; bottom:16px; z-index:60;
  display:flex; gap:2px; padding:3px;
  background:var(--surface); border:1px solid var(--rule);
  border-radius:999px; box-shadow:var(--shadow);
}
.langbar button{
  font-family:var(--f-cjk); font-size:12.5px; line-height:1; letter-spacing:.02em;
  padding:7px 12px; border-radius:999px; color:var(--muted);
  transition:background .12s ease, color .12s ease;
}
.langbar button:hover{color:var(--ink)}
.langbar button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--f-display); font-weight:700; line-height:1.3; text-wrap:balance; margin:0}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--sw); outline-offset:3px; border-radius:3px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.wrap{max-width:720px; margin:0 auto; padding:0 24px}
.screen{display:none}
.screen.on{display:block}

/* ---------- intro ---------- */
.intro{padding:72px 0 96px}
.intro-mark{display:flex; align-items:center; gap:9px; margin-bottom:26px}
.intro-mark i{width:26px; height:3px; border-radius:2px; display:block}
.intro-mark .a{background:var(--hw)}
.intro-mark .b{background:var(--sw)}
.intro-mark span{font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-left:4px}
.intro h1{font-size:clamp(34px,6.2vw,52px); letter-spacing:-.01em; margin-bottom:18px}
.lede{font-size:17.5px; color:var(--ink-2); max-width:46ch; margin-bottom:36px}
.lede b{color:var(--ink); font-weight:500}
.specs{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); margin-bottom:38px;
}
.spec{padding:16px 0}
.spec + .spec{border-left:1px solid var(--rule-2); padding-left:18px}
.spec .n{font-family:var(--f-mono); font-size:25px; font-weight:500; display:block; line-height:1.25}
.spec .k{font-size:12.5px; color:var(--muted)}
.split{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:38px}
@media(max-width:600px){.split{grid-template-columns:1fr}}
.half{background:var(--surface); padding:20px 22px; border:1px solid var(--rule); border-radius:11px}
.half h3{font-size:16px; margin-bottom:7px; display:flex; align-items:center; gap:9px}
.half h3::before{content:""; width:9px; height:9px; border-radius:2px; flex:none}
.half.hw h3::before{background:var(--hw)}
.half.sw h3::before{background:var(--sw)}
.half p{font-size:13.5px; color:var(--ink-2); line-height:1.68}
.half .cnt{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); margin-top:11px; display:block}
.cta{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.btn{
  display:inline-flex; align-items:center; gap:10px; padding:13px 26px; border-radius:8px;
  background:var(--ink); color:var(--bg); font-weight:500; font-size:15px;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:hover{transform:translateY(-1px); opacity:.9}
.btn.ghost{background:none; color:var(--ink-2); border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--ink-2); color:var(--ink)}
.note{font-size:13px; color:var(--muted); margin-top:24px; max-width:54ch; line-height:1.7}

/* ---------- quiz ---------- */
.rail{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--rule); padding:14px 0 12px}
.rail-in{max-width:720px; margin:0 auto; padding:0 24px}
.rail-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; gap:12px}
.rail-block{font-size:13px; font-weight:500}
.rail-block em{font-style:normal; color:var(--muted); font-weight:400}
.rail-count{font-family:var(--f-mono); font-size:12.5px; color:var(--muted); flex:none}
.segs{display:flex; gap:4px}
.seg{flex:1; height:4px; border-radius:2px; background:var(--rule); overflow:hidden}
.seg i{display:block; height:100%; width:0; border-radius:2px; transition:width .35s cubic-bezier(.2,.7,.3,1)}
.seg.hw i{background:var(--hw)}
.seg.sw i{background:var(--sw)}

.q{padding:52px 0 40px; min-height:60vh}
.q-no{margin-bottom:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.q-no b{font-family:var(--f-mono); font-size:12px; font-weight:600; letter-spacing:.1em; color:var(--muted)}
.q-tag{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.07em;
  padding:2px 8px; border-radius:3px; border:1px solid var(--rule); color:var(--muted);
}
.q-tag.hw{color:var(--hw); border-color:var(--hw-line); background:var(--hw-fill)}
.q-tag.sw{color:var(--sw); border-color:var(--sw-line); background:var(--sw-fill)}
.q-text{font-family:var(--f-display); font-size:clamp(20px,3.3vw,24px); font-weight:600; line-height:1.6; margin-bottom:26px; text-wrap:pretty}
.opts{display:flex; flex-direction:column; gap:9px}
.opt{
  display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%;
  padding:14px 17px; border-radius:9px; background:var(--surface);
  border:1px solid var(--rule); line-height:1.62; font-size:15.5px;
  transition:border-color .12s ease, background .12s ease, transform .12s ease;
}
.opt:hover{border-color:var(--ink-2); transform:translateX(2px)}
.opt.sel{border-color:var(--ink); background:var(--surface-2)}
.opt kbd{
  font-family:var(--f-mono); font-size:12px; font-weight:600; flex:none;
  width:22px; height:22px; margin-top:3px; border-radius:4px;
  display:grid; place-items:center; background:var(--surface-3); color:var(--muted);
}
.opt.sel kbd{background:var(--ink); color:var(--bg)}
.numq{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.numq input{
  font-family:var(--f-mono); font-size:24px; width:150px; padding:11px 14px;
  border:1px solid var(--rule); border-radius:8px; background:var(--surface); color:var(--ink);
}
.numq .unit{font-family:var(--f-mono); color:var(--muted); font-size:14px}
.qnav{display:flex; justify-content:space-between; align-items:center; margin-top:28px; gap:14px}
.link{font-size:13.5px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; background:none}
.link:hover{color:var(--ink)}
.hint{font-size:12px; color:var(--muted); font-family:var(--f-mono)}
@media(max-width:560px){#q-hint{display:none}}

/* ---------- result ---------- */
.res{padding:46px 0 100px}
.res-head{margin-bottom:32px}
.res-head h1{font-size:clamp(29px,5.2vw,40px); letter-spacing:-.01em; margin:10px 0 12px}
.res-sub{color:var(--ink-2); font-size:15.5px; max-width:52ch}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:26px; margin-bottom:20px; box-shadow:var(--shadow)}
.card-h{display:flex; justify-content:space-between; align-items:baseline; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.card-h h2{font-size:18px}
.card-h .sub{font-size:12.5px; color:var(--muted)}
.radar-wrap{display:flex; justify-content:center; position:relative; max-width:100%}
svg.radar{width:100%; max-width:500px; height:auto}
@media(max-width:600px){
  svg.radar text.ax{font-size:16px}
  svg.radar text.axn{font-size:17px}
}
svg.radar text.ax{font-family:var(--f-body); font-size:12.5px; fill:var(--ink-2)}
svg.radar text.axn{font-family:var(--f-mono); font-size:13px; font-weight:600}
svg.radar .hit:focus-visible{outline:none}
svg.radar .hit:focus-visible + *{outline:none}
.key{display:flex; gap:22px; justify-content:center; margin-top:10px; flex-wrap:wrap}
.key i{width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:7px; vertical-align:-1px}
.key span{font-size:12.5px; color:var(--ink-2)}
.tip{
  position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-125%);
  background:var(--ink); color:var(--bg); padding:6px 11px; border-radius:6px;
  font-size:12.5px; white-space:nowrap; transition:opacity .1s ease; z-index:5; left:0; top:0;
}
.tip .v{font-family:var(--f-mono); font-weight:600; margin-left:9px}
.extremes{display:grid; grid-template-columns:1fr 1fr; gap:26px}
@media(max-width:620px){.extremes{grid-template-columns:1fr}}
.ex-col h3{font-size:13px; font-family:var(--f-body); font-weight:700; margin-bottom:10px; color:var(--ink-2)}
.ex-row{display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px dashed var(--rule-2)}
.ex-row .nm{flex:1; font-size:14.5px}
.ex-row .vv{font-family:var(--f-mono); font-size:15px; font-weight:600}
.ex-row .dot{width:7px; height:7px; border-radius:50%; flex:none; align-self:center}
.grp-title{display:flex; align-items:center; gap:12px; margin:36px 0 14px}
.grp-title h2{font-size:15px; font-family:var(--f-body); font-weight:700; letter-spacing:.02em; flex:none}
.grp-title .bar{flex:1; height:1px; background:var(--rule)}
.grp-title .cnt{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); flex:none}
.groups{display:grid; gap:10px}
.gcard{background:var(--surface); border:1px solid var(--rule); border-radius:12px; overflow:hidden}
.gcard > summary{list-style:none; cursor:pointer; padding:17px 22px; display:flex; align-items:center; gap:16px}
.gcard > summary::-webkit-details-marker{display:none}
.gcard > summary:hover{background:var(--surface-2)}
.g-name{font-family:var(--f-display); font-weight:600; font-size:16.5px; flex:none; width:104px}
.g-track{flex:1; height:8px; border-radius:4px; background:var(--surface-3); overflow:hidden; min-width:50px}
.g-track i{display:block; height:100%; border-radius:4px; width:0; transition:width .8s cubic-bezier(.2,.7,.3,1)}
.g-val{font-family:var(--f-mono); font-size:17px; font-weight:600; width:32px; text-align:right}
.g-chev{color:var(--muted); font-size:10px; transition:transform .2s ease; flex:none; font-family:var(--f-mono)}
details[open] .g-chev{transform:rotate(90deg)}
.g-body{padding:2px 22px 18px; border-top:1px solid var(--rule-2)}
.dim{padding:14px 0; border-bottom:1px dashed var(--rule-2)}
.dim:last-child{border-bottom:none}
.dim-top{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.dim-nm{font-size:14.5px; font-weight:500; flex:none; width:104px}
.dim-track{flex:1; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; min-width:40px}
.dim-track i{display:block; height:100%; border-radius:3px; width:0; transition:width .8s cubic-bezier(.2,.7,.3,1)}
.dim-val{font-family:var(--f-mono); font-size:13.5px; font-weight:500; width:32px; text-align:right; color:var(--ink-2)}
.dim-say{font-size:13.5px; color:var(--ink-2); line-height:1.65}
@media(max-width:560px){.g-name,.dim-nm{width:auto; min-width:70px}}
:root[data-l="en"] .g-name,
:root[data-l="en"] .dim-nm,
:root[data-l="en"] .meter-row .nm{width:158px}
@media(max-width:560px){:root[data-l="en"] .g-name,
  :root[data-l="en"] .dim-nm,
  :root[data-l="en"] .meter-row .nm{width:auto; min-width:96px}}
.scenes{display:grid; grid-template-columns:1fr 1fr; gap:26px}
@media(max-width:620px){.scenes{grid-template-columns:1fr}}
.sc-col h3{font-size:13px; font-family:var(--f-body); font-weight:700; margin-bottom:10px; color:var(--ink-2)}
.sc-row{display:flex; align-items:baseline; gap:11px; padding:10px 0; border-bottom:1px dashed var(--rule-2)}
.sc-row:last-child{border-bottom:none}
.sc-rank{font-family:var(--f-mono); font-size:11px; color:var(--muted); width:16px; flex:none}
.sc-main{flex:1; min-width:0}
.sc-name{font-size:14.5px; display:block; line-height:1.45}
.sc-why{font-size:11.5px; color:var(--muted); display:block; margin-top:2px; line-height:1.5}
.sc-val{font-family:var(--f-mono); font-size:15px; font-weight:600; flex:none}
.sc-dot{width:7px; height:7px; border-radius:50%; flex:none; align-self:center}
.sc-all{margin-top:22px; border-top:1px solid var(--rule-2); padding-top:16px}
.sc-all > summary{list-style:none; cursor:pointer; font-size:13.5px; color:var(--ink-2); display:flex; align-items:center; gap:10px}
.sc-all > summary::-webkit-details-marker{display:none}
.sc-all > summary:hover{color:var(--ink)}
.sc-full{display:grid; grid-template-columns:1fr 1fr; gap:0 26px; margin-top:8px}
@media(max-width:620px){.sc-full{grid-template-columns:1fr}}
.dim-ex{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.55}
.tags{display:flex; flex-wrap:wrap; gap:9px}
.tag{font-size:13px; padding:6px 13px; border-radius:999px; border:1px solid var(--rule); background:var(--surface-2); color:var(--ink-2)}
.tag b{color:var(--ink); font-weight:600; font-family:var(--f-mono)}
.tag.hw{border-color:var(--hw-line); background:var(--hw-fill)}
.meter-row{display:flex; align-items:center; gap:14px; padding:10px 0}
.meter-row .nm{width:104px; flex:none; font-size:14.5px; font-weight:500}
.calib{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:20px}
.cal{border-left:2px solid var(--rule); padding-left:14px}
.cal .k{font-size:12px; color:var(--muted); display:block; margin-bottom:1px}
.cal .v{font-family:var(--f-mono); font-size:21px; font-weight:600; display:block; line-height:1.35}
.cal .d{font-size:12.5px; color:var(--ink-2); line-height:1.6; margin-top:4px}
.foot{display:flex; gap:12px; flex-wrap:wrap; margin-top:32px; align-items:center}
.tcard{
  background:var(--surface); border:1px solid var(--rule); border-radius:14px;
  padding:30px 26px 26px; margin-bottom:20px; box-shadow:var(--shadow);
  position:relative; overflow:hidden;
}
.tcard::before{
  content:""; position:absolute; inset:0 0 auto 0; height:3px;
  background:linear-gradient(90deg, var(--hw), var(--sw));
}
.t-eyebrow{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin-bottom:12px;
}
.t-name{
  font-family:var(--f-display); font-weight:700; line-height:1.2;
  font-size:clamp(30px,6vw,46px); letter-spacing:-.01em; margin:0 0 6px;
  text-wrap:balance;
}
.t-name .pre{color:var(--ink-2); font-weight:600}
.t-tag{font-size:16px; color:var(--ink-2); margin:0 0 18px}
.t-axes{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
.t-ax{
  display:inline-flex; align-items:baseline; gap:7px;
  font-size:12.5px; padding:5px 11px; border-radius:999px;
  border:1px solid var(--rule); background:var(--surface-2); color:var(--ink-2);
}
.t-ax b{font-family:var(--f-mono); font-size:13px; font-weight:600; color:var(--ink)}
.t-ax i{width:7px; height:7px; border-radius:50%; flex:none; align-self:center}
.t-ax.n1{border-color:var(--ink-2)}
.t-desc{font-size:14.5px; color:var(--ink-2); line-height:1.75; margin:0}

/* ---------- 歷史記錄 ---------- */
.hist{margin-top:38px; border-top:1px solid var(--rule); padding-top:22px}
.hist-h{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:14px}
.hist-h h3{font-size:14px; letter-spacing:.02em}
.hist-h .sub{font-size:12px; color:var(--muted)}
.hist-row{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  padding:12px 14px; background:var(--surface); border:1px solid var(--rule);
  border-radius:10px; color:var(--ink); transition:border-color .15s, transform .15s;
}
.hist-item{display:flex; align-items:center; gap:6px; margin-bottom:8px}
.hist-row:hover{border-color:var(--ink-2); transform:translateX(2px)}
.hist-row .when{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); flex:none; width:92px}
.hist-row .who{font-size:14px; font-weight:500; flex:1; min-width:0}
.hist-row .stat{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); flex:none}
.hist-row .rate-tag{font-size:11.5px; color:var(--ink-2); border:1px solid var(--rule); border-radius:999px; padding:2px 8px; flex:none}
.hist-del{color:var(--muted); font-size:17px; line-height:1; padding:6px 8px; border-radius:8px; flex:none}
.hist-del:hover{color:var(--hw); background:var(--surface-3)}
@media(max-width:600px){
  .hist-row{flex-wrap:wrap; gap:8px}
  .hist-row .when{width:auto}
  .hist-row .who{flex-basis:100%; order:-1}
}

/* ---------- 自評與壓縮碼 ---------- */
.rate{display:flex; gap:9px; flex-wrap:wrap}
.rate button{
  width:46px; height:46px; border-radius:10px; border:1px solid var(--rule);
  background:var(--surface-2); color:var(--ink-2);
  font-family:var(--f-mono); font-size:16px; transition:.15s;
}
.rate button:hover{border-color:var(--ink-2); color:var(--ink)}
.rate button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.rate-ends{display:flex; justify-content:space-between; max-width:266px; font-size:11.5px; color:var(--muted); margin:8px 0 0}
.codebox{margin-top:20px; border-top:1px solid var(--rule-2); padding-top:16px}
.codebox .k{display:block; font-size:12px; color:var(--muted); margin-bottom:7px}
.codebox code{

EN.title = {
EP:{n:"Beast", tag:"Huge output, and it never runs out",
  d:"Anything a body alone can solve runs straight through you — lifting, hauling, bracing, running. What takes others two days of physical work you finish in one. The weakness: the moment a problem calls for finesse, precision or negotiation, none of that advantage transfers. Find a partner rather than forcing it."},
AP:{n:"Vanguard", tag:"Fast and heavy, straight through the front",
  d:"Starts, contested moments, being first through the door — reaction and burst arrive together, and you have moved while others are still deciding. The cost is that your stamina cannot keep up with that ferocity; a long war of attrition breaks you in the second half. Pick tasks that are short and dense."},
CP:{n:"Ironhand", tag:"Strong, but the hands stay steady",
  d:"Work that needs force and precision at once is where you belong — moving fragile things, running heavy machinery, physical work that lives on feel. That combination is far rarer than strength alone. What genuinely costs you is anything advanced by persuasion and coordination; your edge is in the hands, not the mouth."},
AE:{n:"Hunter", tag:"Chases long, and still dodges",
  d:"You keep up, you can afford the drain, and a sudden change does not shake you off. Anything requiring sustained alertness is where you are most reliable. What you do badly is the single burst that has to force something through; you win by grinding, not by maxing out for a moment."},
CE:{n:"Nightkeeper", tag:"Outlasts it, and still notices",
  d:"You hold focus and precision for long stretches without the quality dropping. Night watch, monitoring, fine work over long hours — others fall apart after two hours and you finish the shift. The cost is pace: anywhere that needs an instant reaction or an instant call, you read as slow."},
AC:{n:"Marksman", tag:"Fast, and accurate",
  d:"Quick reactions and steady hands usually exclude each other; in you they hold at once, so anything requiring an exact movement in almost no time has few rivals. The weakness is that endurance and strength will not carry long, high intensity. You are built for the decisive moment, not the whole attritional stretch."},
KP:{n:"Breaker", tag:"Sees through it, and breaks through it",
  d:"Facing something stuck, you can take its structure apart and you also have the raw means to force it, so you never stall at understanding a problem you cannot move. Be careful that both your tools are frontal assaults — situations needing a detour, patience, or calming people down are easy to overdo."},
PR:{n:"Forgewright", tag:"Dreams it up, and actually builds it",
  d:"Ideas plus the physical capacity to make them real: you are the kind who actually gets up and builds what is in your head rather than pitching it. The difficulty is pacing and finishing — work often gets halfway before a new idea takes over."},
PX:{n:"Battering Ram", tag:"Once decided, pushed all the way",
  d:"Whatever you commit to gets forced through on sheer momentum, body and will holding it up together, and very little stops you midway. The risk is that a wrong direction travels just as far. Ten extra minutes confirming the target before you start pays better than an extra hour of pushing."},
PS:{n:"Frontline Captain", tag:"You go first; the rest follow",
  d:"You move people by doing it yourself, which is especially effective wherever someone has to be the first to stand up — your persuasiveness comes from having actually done it. Relatively weaker is analysis and planning; the arrangement that suits you is others setting direction and you carrying it."},
EK:{n:"Ascetic Scholar", tag:"A mind that can afford the drain",
  d:"Anything that has to be studied for a long time, turned over repeatedly, chewed through slowly is your ground — where others quit is roughly where you start. The weak side is burst and improvisation; situations demanding fast reactions or a call on the spot make you uncomfortable."},
ER:{n:"Longform Maker", tag:"Long work that actually gets finished",
  d:"Most creative people cannot finish long work. You can, which suits output that takes months or years and has no correct answer. Watch pacing and outside coordination — you can go a long way alone, but you do not move other people much."},
EX:{n:"Ironheart", tag:"Holds up, and delivers",
  d:"Long, unrewarded, unsupervised work gets finished by you, and that reliability is rare in any field. The cost is change and improvisation: when a plan breaks you need time to regroup, so structurally stable environments suit you."},
ES:{n:"Anchor", tag:"The steadiest one when things go wrong",
  d:"You last, and you do not come apart emotionally, so in a long campaign you are what keeps the group from scattering — everyone else's state gets steadied by yours. What you are not good at is speed and precision; hand the fast, exact work to someone else."},
AK:{n:"Falcon", tag:"Body and mind both fast",
  d:"Reading a situation fast and acting immediately is your strength; you have found the direction and started moving while the information is still incomplete. Watch persistence and finishing — as things drag on, your interest and your energy drop together."},
AR:{n:"Improviser", tag:"No script, and still a performance",
  d:"Producing something on the spot is instinct for you; the messier it gets the more alive you are, and while others panic you are wondering whether there is a more interesting way. The weakness is repetition and discipline — work that runs to a fixed schedule over a long time drains you."},
AX:{n:"Operative", tag:"Handed it, and already executing",
  d:"Fast reactions plus will and scheduling: cleaning up a chaotic task in a short window is your speciality, and anything dropped on you at short notice is best given to you. Be careful with long endurance and coordinating people — you solve things yourself well, and lead a group slowly badly."},
AS:{n:"Room Reader", tag:"Reads the air, and catches it",
  d:"You register a shift in mood the instant it happens, and you react fast enough to catch it. Dead air, conflict and sudden awkwardness do not survive three seconds around you. Comparatively thin are depth and stamina; work requiring long study or solitary grinding is not your stage."},
CK:{n:"Human Calculator", tag:"The mind is exact, and so are the hands",
  d:"Logic, numbers and sensory resolution are all online at once, so work that has to be right the first time almost never goes wrong in your hands. The cost is speed and a physical ceiling: you win by being exact, not by volume or pace."},
CR:{n:"Artificer", tag:"The taste and the craft both there",
  d:"You can see what it should look like and actually produce it at that level of precision, which maps directly onto every field built on making things by hand. The difficulty is momentum and finishing — you get stuck on details, so it is worth setting a deliberate good-enough-to-ship line."},
CX:{n:"Surgeon", tag:"Hands do not shake, attention does not drift",
  d:"High precision plus high focus: work with almost no margin for error suits you, and what would go wrong in someone else's hands does not in yours. The weak points are flexibility and people — a broken process or improvised coordination sits worse with you than with most."},
CS:{n:"Tuner", tag:"Notices the finest thing in the room",
  d:"Sharp senses plus reading people means you catch signals others miss — tone, expression, the thing that is not right about a room. Be aware that this sensitivity costs you: harsh or high-intensity environments damage you more than they damage other people."},
KR:{n:"Higher Being", tag:"Thinks deep, and thinks strange",
  d:"Abstract reasoning plus originality takes you down paths nobody has walked, and you can say why the path holds. The trouble is landing it and communicating it — when the idea is too far ahead, people cannot follow. Finding someone who can translate you outward beats explaining it yourself."},
KX:{n:"Architect", tag:"Thinks it through, and actually builds it",
  d:"Work the structure out first, then move, then genuinely finish — a combination rare enough to define an entire career. Watch the body and improvisation: the quality of your output leans hard on a stable state, and once your routine slips the whole line goes slack."},
KS:{n:"Strategist", tag:"Sees through it, and makes it land",
  d:"You can read a situation and say what you read in a way people will accept, which is worth most in any position that shapes decisions. The weak side is hands-on execution and physical capacity; your best seat is beside the decision, not carrying it yourself."},
RX:{n:"Showrunner", tag:"From nothing, and finished",
  d:"Having the idea and also finishing it is the scarcest combination in creative work — most people have one half. The difficulty is the body and fine precision: sustained high output burns your energy first, so recovery has to be scheduled in."},
RS:{n:"Harmony Mage", tag:"Tunes the room to the right frequency",
  d:"Charisma plus imagination lets you change the state of a group — mood, consensus and morale are all within your reach. Be careful with structure and discipline; anything needing an exact process or long grinding is where you will need someone else to cover."},
SX:{n:"Commander", tag:"Gets people moving, and makes the call",
  d:"Decisiveness plus the ability to carry people means that in chaos you naturally become the one who converges the decision — and you actually move it. Watch that your body is the floor under all of it: when your physical state collapses, so does the group you were holding up."},
GEN:{n:"Generalist", tag:"No weak spot, and no spike either",
  d:"Your eight attributes sit too close together for a forced strongest to mean anything — and that shape is itself an answer: you can take on anything, and nothing goes badly wrong. The advantage is any role that fills gaps and connects things; the cost is that no single strength makes you memorable, so it is worth deliberately pushing one of them up."}

DescLo":"你在情境自评题偏向低估自己，客观题与校验题的表现比自评好。已对只有自评来源的维度往上修正。","biasDescOk":"你的自评与客观证据一致，面板几乎没有被修正过。","spreadUnit":" 级","spreadDesc":"同一维度在不同区块之间的平均差距（满分 4 级）。落差越小，代表你对自己的认知越稳定。","extremeHi":"几乎每题都选到最强选项。统计上这极不可能，这张面板应该当成你的自我期待，而不是量测结果。","extremeMid":"你选到该题最强选项的比例偏高，可信度已因此下修。","extremeOk":"选项分布正常，没有明显的往高分靠拢倾向。","parTitle":"参数与外在条件","parSub":"修正系数，不计入能力评分","tagSoma":"体型倾向","tagBmi":"BMI","tagH":"身高","tagW":"体重","unitCm":" cm","unitKg":" kg","bmi1":"偏轻","bmi2":"标准范围","bmi3":"略重","bmi4":"偏重","somaEcto":"外胚型","somaMeso":"中胚型","somaEndo":"内胚型","somaLean":"偏{a}","somaBetween":"偏{a}／{b}之间","somaNoteEcto":"骨架细、不易增重，力量与耐力的天然加成偏低，但速度与续航的相对负担小。","somaNoteMeso":"肌肉反应快，力量与爆发的天然加成最高，训练回报率好。","somaNoteEndo":"骨架厚实、力量底子好，但续航与敏捷会被体重拖累，体重管理的边际效益最大。","parNote":"体型倾向不是能力分数，而是修正系数：{x} 读上面的硬件数值时，把这个系数一起考虑进去。","dimUnit":"维度","dimEx":"常见场合：","btnAgain":"重新测一次","btnCopy":"拷贝面板数值","copyOk":"已拷贝","copyFail":"拷贝失败，请手动选取","copyTitle":"个人属性面板","copySoma":"体型倾向：","copyRel":"面板可信度：","copyTop5":"最吃得开的五件事：","copyBot5":"最吃力的五件事：","ttlTag":"称号已判定","ttlSub":"由前三项主属性决定","ttlFmt":"{p}的{n}","ttlFmtNone":"{n}","copyTtl":"称号："},"dim":{"str":{"n":"力量","ex":"搬重物、帮人搬家、扛行李上楼","h":"需要硬扛的场合你顶得住：搬、抬、撑、拉，靠绝对出力就能解决的问题不会卡住你。","m":"出力属一般水平，日常负重不成问题，但不是靠力气取胜的类型。","l":"纯比力气的场合会先撑不住，这类任务值得用工具、杠杆或找人分担来绕过。"},"pow":{"n":"爆发力","ex":"短跑冲刺、起跳、追公交车","h":"起跑、起跳、瞬间发力的场合占优，短时间拉满的挑战是你的主场。","m":"瞬间发力中规中矩，需要爆发时不吃亏也不特别占便宜。","l":"瞬间出力偏弱，需要一下子拉满的场合会慢半拍，但不影响持久型任务。"},"end":{"n":"耐力","ex":"跑长距离、逛一整天、连续加班","h":"长时间、低强度的消耗你熬得住，马拉松式的任务比短跑式的更适合你。","m":"续航够用，能撑完一般长度的消耗，但拉长到极限会明显掉速。","l":"持久战是你的弱项，长时间任务要主动切成段落、安排休息，否则后半段会崩。"},"rec":{"n":"恢复力","ex":"熬夜后回血、运动隔天的状态、密集调度","h":"消耗完能很快回满，高强度连续作战对你损伤小，可以承受密集调度。","m":"恢复速度普通，连续高强度两三天后需要一天缓冲。","l":"回血慢，一次过度消耗会拖累接下来好几天，调度必须留出恢复期而不是硬塞。"},"pai":{"n":"痛觉与不适耐受","ex":"看牙医、吃辣、忍过闷热与酸痛","h":"痛、累、闷热、饥饿这类不适不容易动摇你，恶劣条件下仍能维持判断。","m":"对不适的忍耐力一般，能撑一阵子，但持续的难受会开始影响表现。","l":"对疼痛与不适敏感，恶劣环境会显著拖垮你的表现，值得优先改善环境而非硬忍。"},"imm":{"n":"免疫基础","ex":"换季不倒、待在群聚环境、长期计划不掉链子","h":"不容易生病，季节交替、群聚环境、作息小乱都不太会让你倒下。","m":"免疫力普通，一年会被放倒一两次，多半在疲劳期。","l":"容易生病且好得慢，任何长期计划都该把生病的空窗算进去。"},"slp":{"n":"睡眠与生物钟","ex":"早起、调时差、每天状态的稳定度","h":"睡得稳、醒得准，作息本身就是你的资源，状态起伏小、可预测。","m":"睡眠质量中等，多数日子够用，但熬夜或时差会让你明显掉状态。","l":"睡眠是你最不稳的变量，其他所有维度的表现都会被它拉着走，优先修这一项回报最高。"},"spd":{"n":"动作速度","ex":"赶时间的移动、把手上的事做完的速度","h":"从决定到做完之间的时间很短，需要快速执行的体力活你完成得比别人快。","m":"动作速度一般，不拖沓也不特别俐落。","l":"执行动作偏慢，讲求速度的场合吃亏，但换到讲求精准的场合影响不大。"},"rea":{"n":"反应速度","ex":"球类运动、急煞、接住掉下来的东西","h":"突发状况出现时你的身体先动了，需要实时反应的场合（闪避、接住、急煞）明显占优。","m":"反应速度接近平均，一般突发状况来得及应付。","l":"神经传导偏慢，临场反应吃亏，需要靠提前预判、提前部署来补。"},"bal":{"n":"平衡","ex":"滑板与滑雪、站着的公交车、崎岖路面","h":"重心稳，不平整、摇晃、单脚受力的场合你不容易失衡，跌倒风险低。","m":"平衡感一般，正常地形没问题，复杂地形会小心翼翼。","l":"重心不稳，需要平衡的活动会消耗你额外的注意力，这也会连带拖慢其他表现。"},"eye":{"n":"手眼协调","ex":"打球、开车、需要瞄准的游戏","h":"眼睛看到与手做出来对得很准，球类、驾驶、操作器械这类任务上手快。","m":"手眼配合一般，多数操作型任务练一下就能胜任。","l":"看到与做到之间有落差，操作型任务需要更多练习量才能到同样水平。"},"fin":{"n":"精细动作","ex":"做模型与手工、贴手机膜、弹乐器","h":"小尺度、高精度的手上功夫做得好：乐器、手作、器械、任何需要稳定小肌肉的事。","m":"精细操作一般，可以做，但速度与稳定度不会是你的卖点。","l":"手上的精度不高，需要微调的工作会做得慢且累，适合改用工具或流程来降低精度需求。"},"flx":{"n":"柔韧性","ex":"瑜伽与伸展、大角度动作不受伤","h":"关节活动范围大，姿势受限的场合仍能出力，运动伤害风险也较低。","m":"柔韧度普通，日常没问题，大角度动作会有点紧。","l":"身体偏紧，活动范围受限，较容易拉伤，这也会限制力量与速度的实际发挥。"},"sen":{"n":"感官敏锐度","ex":"吵杂环境里听清楚、发现细节变化、分辨味道","h":"看得细、听得清、闻得出差别，你能接收到别人漏掉的消息，适合靠察觉取胜的场合。","m":"感官接近平均，重要信号不会漏，但细微差别要专心才抓得到。","l":"感官分辨率较低，细节容易漏掉，重要判断值得依赖仪器、记录或第二个人确认。"},"lrn":{"n":"学习力","ex":"上手新软件、换跑道、自学一门技能","h":"进入陌生领域的成本低，你能快速抓到结构并开始产出，适合需要频繁换赛道的位置。","m":"学习速度一般，给足时间能学会，但起步阶段需要别人领一下。","l":"新东西上手慢，优势应该押在深耕已有领域，而不是不断开新战场。"},"mem":{"n":"记忆力","ex":"需要背诵的考试、记人名、记得前情提要","h":"记得住也调得出来，需要大量事实、细节、前情提要的场合你不用回头翻。","m":"记忆普通，重点记得住，细节得靠笔记。","l":"记忆是弱项，任何依赖大脑存储的工作都该外接成笔记与系统，这比硬记划算得多。"},"cur":{"n":"好奇心","ex":"长期自学、探索陌生领域、钻研冷门的事","h":"不需要外力推动就会往下挖，长期学习与探索型任务靠内驱力就能持续。","m":"对感兴趣的事会探究，但不会主动扩张到陌生领域。","l":"求知驱动偏低，学习需要明确的外部理由或压力，适合目标清楚的任务而非开放探索。"},"lng":{"n":"语言天赋","ex":"学外语、掌握新术语、用非母语工作","h":"对语音、语法、语感敏锐，学外语与掌握新术语体系的速度明显快过一般人。","m":"语言学习一般，肯投时间就能学会，但不会特别轻松。","l":"语言不是你的入口，跨语言的任务要多留时间，或改走视觉与逻辑的理解路径。"},"log":{"n":"逻辑推理","ex":"抓论述漏洞、调试、拆解复杂规则","h":"能拆解前提、看出跳步与矛盾，复杂且有明确规则的问题你解得干净。","m":"推理能力一般，结构清楚的问题没问题，多层嵌套的论证会需要写下来。","l":"抽象推演吃力，遇到复杂论证要靠具体例子与图表落地，硬在脑中推容易出错。"},"spa":{"n":"空间想像","ex":"看组装图、认路、设计实体对象","h":"脑中能转动立体结构，看图、认路、组装、设计实体对象对你是直觉的事。","m":"空间感一般，看得懂图，复杂结构要实际比划一下。","l":"脑内置模吃力，涉及立体与方位的任务靠模型、实物或导航会比靠想像可靠。"},"num":{"n":"数感","ex":"心算分账、看懂统计数字、估预算","h":"对数量级、比例、概率有直觉，一眼看得出数字合不合理，不容易被统计唬住。","m":"数字感一般，算得出来，但要花点时间才会判断合不合理。","l":"对数字缺乏直觉，涉及金额、概率、比例的决策应该落成计算或找人覆核，不要凭感觉。"},"itu":{"n":"直觉与模式识别","ex":"信息不足时判断、看人、觉得哪里不对劲","h":"还说不出理由时就先察觉到不对劲，信息不足的场合你的第一判断值得信。","m":"直觉普通，有时准有时不准，值得跟明确证据交叉比对。","l":"模式识别偏弱，信息不足时的猜测不可靠，决策应该尽量拖到证据齐了再下。"},"cre":{"n":"创造力","ex":"想新点子、面对开放式命题、从零开始","h":"能生出别人没想到的组合，开放式、没有标准答案的问题是你的优势区。","m":"在既有框架内能做出变化，但很少推翻框架。","l":"原创产出不是你的强项，换到优化、执行、把别人的点子做扎实会更有价值。"},"aes":{"n":"审美","ex":"挑礼物与衣服、做PPT版面、布置空间","h":"对好坏的判断稳定且细，能看出哪里不对并说得出来，适合把关质量的位置。","m":"审美一般，分得出明显好坏，细微差别需要比较才看得出来。","l":"美感判断不稳，涉及呈现与品味的决定值得交给参考范例或他人把关。"},"mus":{"n":"音乐感知","ex":"学乐器、唱歌抓音准、听出编曲层次","h":"对音准、节奏、声音层次敏感，音乐与任何有节奏结构的事情你抓得住。","m":"音乐感一般，跟得上节奏，细部音准需要对照。","l":"听觉结构解析偏弱，音乐相关的事得靠反复练习而非直觉。"},"foc":{"n":"专注力","ex":"读长文、深度工作、不被手机带走","h":"能长时间投入单一任务不被打断带走，深度工作是你能稳定交付的东西。","m":"专注一般，能撑一段时间，但环境一乱就会断线。","l":"注意力容易被拉走，与其硬撑长时段，不如把工作切碎并主动清掉干扰源。"},"wil":{"n":"意志力与自律","ex":"早起、戒掉习惯、做完没人监督的事","h":"没有动力时仍然做得下去，长期、无反馈的事情你能靠纪律推完。","m":"自律中等，有外部节奏（截止日、同伴）时执行得不错。","l":"靠意志硬撑效果差，你需要的是外部约束与环境设计，而不是再下一次决心。"},"tim":{"n":"时间统筹","ex":"赶截止日、排多人进程、估时间","h":"对时间的估算准，能同时排好多线任务，不太会出现赶不上的意外。","m":"时间感普通，单线任务排得好，多线并行会开始乱。","l":"时间估算偏差大，任何多线程安排都该外接日程表与缓冲，靠感觉一定会爆。"},"adp":{"n":"应变力","ex":"计划被打乱、临时换题目、突发状况","h":"计划被打乱时你切换得快，混乱与变动的环境反而对你有利。","m":"应变一般，变动不大时能调整，剧烈变动需要时间重整。","l":"变动会让你失速，适合结构稳定、变量少的环境，或事先准备好备案。"},"rsk":{"n":"风险决策","ex":"做决定、谈判、信息不足时下注","h":"敢在信息不完整时下注，也守得住停损，需要果断的关口不会卡在你这里。","m":"风险判断中等，重要决定会反复权衡，但最后做得出来。","l":"面对不确定会拖延或过度保守，决策该设好期限与条件，让规则替你按下按钮。"},"emo":{"n":"情绪稳定性","ex":"吵架、高压场合、被当面批评的当下","h":"高压与冲突下情绪不易失控，判断质量不会被当下的情绪吃掉。","m":"情绪大致稳定，遇到大事会波动但回得来。","l":"情绪起伏会直接影响判断，重要决定值得刻意延后到情绪平复之后再做。"},"res":{"n":"耐挫力","ex":"失败后重来、被否定后继续、长期没进展","h":"失败后回到场上的速度快，需要反复试错的长期任务你耗得起。","m":"挫折后需要一点时间，但不会就此放弃。","l":"一次重挫可能让你长时间停摆，适合把目标切小、让成功反馈密一点。"},"saw":{"n":"自我觉察","ex":"知道自己快撑不住、找到情绪的源头、选对方法","h":"清楚自己的状态、动机与极限，能在出事前就调整，这是所有软件维度的放大器。","m":"对自己有基本认识，但常常事后才明白当时发生了什么。","l":"对自身状态的判断不准，容易高估或低估自己，值得靠记录与他人反馈来校正。"},"soc":{"n":"社交敏感度","ex":"读气氛、多方协调、听出言外之意","h":"察觉得到气氛与立场的变化，多方协调、谈判、读懂潜台词的场合你占优。","m":"社交信号大致读得懂，细微的暗示会漏掉。","l":"不容易读出言外之意，与其猜，不如把事情讲明、要求对方明说，这对你更有效。"},"emp":{"n":"共情深度","ex":"安慰别人、被人托付、创建信任","h":"能真正进入别人的处境，信任创建得快，适合需要被托付的角色。","m":"能理解他人感受，但不会被牵动太深。","l":"对他人情绪感受较淡，这在需要冷静的场合是优势，在需要陪伴的场合则要靠方法补。"},"exp":{"n":"表达力","ex":"上台汇报、把复杂的事讲清楚、写得让人读得下去","h":"想得到也讲得出来，复杂的东西你能说到别人听懂，这让你其他能力被看见。","m":"表达清楚但不特别有感染力，准备过的内容讲得比即席好。","l":"脑中有东西但输出时失真，值得靠书面、图表或预先演练来补足即席表达。"},"ldr":{"n":"领导与组织","ex":"带团队、收敛讨论、在混乱中拍板","h":"能让一群人朝同一方向动起来，混乱中你会自然变成收敛决策的那个人。","m":"带小团队可以，人一多或冲突一起就会吃力。","l":"组织他人不是你的优势，贡献更适合来自个人产出，或在有明确架构的团队中行动。"},"hum":{"n":"幽默感","ex":"化解尴尬、炒热气氛、缓和冲突","h":"能用一句话卸掉紧张，这是你在冲突与尴尬场合最有效的工具。","m":"幽默感一般，听得懂也接得上，但不常主动制造。","l":"不太靠幽默运作，缓和气氛要换成诚恳与直接，那对你更自然也更有效。"},"aura":{"n":"外在风格与气场","ex":"第一印象、被记住、需要创建初步信任的场合","h":"外在给人的第一印象鲜明且一致，你在需要创建初步信任的场合有起手优势。","m":"外在印象中性，不会扣分也不会加分，靠内容说话。","l":"外在辨识度低，第一印象帮不上忙，值得把力气放在让人记住的内容与作品上。"},"voi":{"n":"声音条件","ex":"口说场合、电话与语音频息、需要说服的时候","h":"声音本身有辨识度与说服力，口语场合你的话比别人更容易被听进去。","m":"声音条件普通，讲清楚就有效，不构成加减分。","l":"声音不是你的武器，重要沟通用文字或视觉辅助会比纯口说更有效。"}},"scene":["跟人吵架而且吵赢","第一次见面就聊得起来","安慰一个正在难过的人","在群里当炒热气氛的人","谈判、砍价、争取加薪","带一个十人团队","上台做三十分钟的汇报","拒绝别人不合理的要求","读懂会议室里没说出口的立场","主持讨论并收出一个结论","跟陌生人破冰、问路、搭话","在两个吵起来的人中间当和事佬","面试时把自己讲好","把坏消息告诉当事人","专心读书两小时不碰手机","快速理解一个全新的概念","自学一门技能到能拿来用","准备一场要大量背诵的考试","学一门新的外语","读完一篇很长又没有小标的文章","抓出一段论述里的逻辑漏洞","判断一则新闻的数字有没有被玩过","心算分账、抓预算","看懂一张复杂的组装图","在陌生城市不靠导航走回去","记住刚认识的一群人的名字","一个下午搞懂一套没用过的软件","教会别人一件你会的事","想出一个没人想过的点子","把一份PPT做得好看","挑礼物、挑衣服、布置房间","写一篇让人读得下去的文章","学一样乐器到能弹完整首曲子","把一件复杂的事讲到别人听懂","一眼看出照片或设计哪里不对劲","一个人把长期计划做到完","在期限前把东西交出去","同时处理三件都很急的事","临时被抽换工作内容还接得住","在信息不足的情况下做决定","从二十个差不多的选项里挑一个","规划一趟多人的旅行","戒掉一个不好的习惯","每天早起","让房间长期维持不乱","被当面否定之后还能继续做","失败一次后很快回到场上","在高压场合不失常","一个人待很久也不会出问题","察觉自己快撑不住并提前收手","搬家、帮人扛重物","跑完一场半马","打篮球、羽毛球这类要反应的球类","学会滑板、溜冰、滑雪","熬夜赶工后隔天照常上班","连续加班一整周不倒下","做模型、手工、组装精密的东西","打字、快捷键快到不用想","长途开车一整天不出事","瑜伽、伸展这类要柔软度的运动","忍过牙医、打针、超辣的东西","在吵杂的餐厅里听清楚对方讲话","一年到头几乎不生病","站着工作或看摊一整天","爬一座郊山，当天来回","抱着小孩或重物站很久","陪小孩或狗跑一整个下午","在湿冷或闷热的户外待一整天","久坐久站之后身体不会卡住","出国第一天就把时差调回来","追上一班正要开走的车","在高峰人潮里快步穿行不撞到人","手机掉下去的瞬间反手接住","学会游泳，或一口气游一千公尺","学一段编舞并跳得整齐","同时顾三个炉火，还要切菜","自己组装或修理家里的东西","在昏暗光线下看清楚，或开夜车","通宵赶工，隔天照样把东西交出去","连续三小时的会议或考试坐得住","一个人办一桌六人份的晚餐","露营、在野外过一夜","搬到另一个城市重新安顿","学一项新运动并打进正式比赛","拍到那个决定性的瞬间","一个人出国自助旅行两周","带一整天的导览或带团","学开车并自己上路","照顾生病的家人一整周","一边看小孩一边把工作做完","服务业站一整天还要应对客人","上台唱一首歌或表演一段","大病或受伤后回到原本的生活"],"q":{"b1":[{"t":"你的身高是多少？","u":"厘米"},{"t":"你的体重大约多少？","u":"公斤"},{"t":"你能连续做多少个标准俯卧撑（不跪姿、不停顿）？","o":["0–5 个","6–15 个","16–25 个","26–40 个","40 个以上"]},{"t":"单杠引体向上（正握、下巴过杠）你能做几个？","o":["0 个，连悬挂都撑不久","0 个，但能悬挂 20 秒以上","1–4 个","5–10 个","10 个以上"]},{"t":"立定跳远，你大概能跳多远？","o":["跳不到自己身高的一半","大约 1.2–1.5 公尺","大约 1.6–1.9 公尺","大约 2.0–2.3 公尺","2.4 公尺以上"]},{"t":"全力冲刺 100 公尺，你大概需要多久？","o":["跑不完，或超过 22 秒","约 18–22 秒","约 15–17 秒","约 13–14 秒","13 秒以内"]},{"t":"用自己舒服的配速慢跑，中间不走路，你最多能跑多久？","o":["5 分钟以内就得停","约 10 分钟","约 20–30 分钟","约 45–60 分钟","一小时以上，且还有余裕"]},{"t":"一口气爬楼梯不休息，爬到第几层会开始明显喘？","o":["2 层就喘","3–4 层","5–7 层","8–12 层","12 层以上还讲得出话"]},{"t":"做了一次超出平常强度的运动后，肌肉酸痛会持续多久？","o":["痛四天以上，而且影响日常动作","约三天","约两天","隔天有感，第二天就差不多好了","几乎不酸痛，隔天照常运动"]},{"t":"最近这一年，你感冒或发烧躺平了几次？","o":["5 次以上，而且常拖很久","3–4 次","2 次","1 次","完全没有"]},{"t":"你平常一天实际睡多久？（依对身体的实际影响排序，不是越多越好）","o":["不到 5 小时","9 小时以上，而且醒来还是累","5–6 小时","8–9 小时","7–8 小时"]},{"t":"躺上床之后，你通常多久会睡着？","o":["经常超过一小时，或整夜难眠","约 40–60 分钟","约 20–30 分钟","约 10–15 分钟","10 分钟以内，几乎沾枕就睡"]},{"t":"你每天入睡的时间，前后浮动大概多大？","o":["完全没有固定，日夜可能颠倒","浮动三小时以上","浮动约两小时","浮动一小时内","几乎固定，连假日也一样"]},{"t":"双腿伸直坐地，身体前弯，你的手能碰到哪里？","o":["连小腿都碰不到，膝盖还得弯","勉强碰到脚踝","碰得到脚趾","手掌能贴到脚掌","上半身能整个贴在腿上"]},{"t":"闭上眼睛单脚站立，你能撑多久不倒？","o":["不到 5 秒","约 5–10 秒","约 11–20 秒","约 21–45 秒","45 秒以上"]},{"t":"用键盘打一段你已经想好的文字，速度大概是？","o":["要一直低头找键，很慢","能盲打但不熟，常打错","顺畅，跟得上思考速度","很快，几乎不用回头改错字","打字快到常常要等自己想"]},{"t":"有人没预警把东西丢向你（例如钥匙），你接住的概率是？","o":["几乎接不到，通常是闪开或被砸到","偶尔接到","一半一半","大多接得到","几乎都接得到，还接得很稳"]},{"t":"矫正后（有戴眼镜就算戴着）的视力与听力，你的状况是？","o":["视力或听力明显受损，影响日常","看得清、听得到，但细节常漏","跟大多数人差不多","比周围的人敏锐一些","常常先发现别人没看到或没听到的东西"]},{"t":"打针、抽血、看牙医钻牙时，你的感受是？","o":["非常难受，会尽量逃避这些事","很不舒服，需要别人陪或做心理准备","会紧张，但撑得过去","还好，可以正常聊天","几乎无感，会直接看针头进去"]},{"t":"吃到明显偏辣的食物时，你的反应是？","o":["一点点就受不了，会避开所有辣的东西","微辣可以，中辣就投降","中辣没问题","很能吃辣，大辣照吃","辣到别人喊救命时你还在加辣"]},{"t":"被人说“你声音很好听”或“你声音很有辨识度”的频率？","o":["从来没有，反而被说听不清楚","没什么人提过","偶尔有人提","常常被提到","很多人讲过，甚至有人因此找你录音或主持"]},{"t":"第一次见面的人，主动提到你外形（打扮、气质、长相）的频率？","o":["几乎不会，也不太被记住","很少","偶尔","经常","几乎每次见新的人都会被提到"]},{"t":"如果你想增重五公斤，会是什么情况？（这题不计分，用来判定体型倾向）","o":["很难，怎么吃都不太长肉","要刻意多吃才会慢慢增加","正常吃就会照比例增加","稍微多吃一点就长得很快","非常容易，而且大多长在肚子"]},{"t":"用另一只手的拇指与中指圈住手腕，情况是？（判定骨架）","o":["还差一大截，圈不起来","勉强碰到","刚好圈住","可以重叠一点","重叠很多，手腕很细"]}],"b2":[{"t":"久坐一小时后站起来，要弯腰绑鞋带时，你的身体是？","o":["腰背整个卡住，得先扶着慢慢来","很紧，要花几秒才弯得下去","有点僵，但没什么阻碍","跟平常一样自然","完全无感，蹲下站起都很顺"]},{"t":"站在行进中的公交车上，没抓扶手时你的状态是？","o":["根本站不住，一定要抓着","只要有晃动就会踉跄","平稳路段可以，急煞就不行","多数状况站得住","急煞转弯都能稳住，还能同时滑手机"]},{"t":"回到一个常待的房间，有人动过或换掉了某样东西，你会？","o":["完全不会发现，被讲了才知道","要很明显的改变才注意得到","觉得怪怪的，但讲不出哪里怪","多半能指出是哪里变了","马上就发现，连位置移了几厘米都知道"]},{"t":"在很吵的餐厅里听对面的人讲话，你的情况是？","o":["几乎全靠猜，或请对方一直重讲","要非常专心才听得懂","听得懂，但很累","没什么问题","不只听得清楚，还能顺便听到隔壁桌在讲什么"]},{"t":"熬夜一整晚之后的隔天，你的状态是？","o":["整天报废，而且要两三天才补得回来","很难受，什么都做不好","效率明显下降，但撑得住基本事务","有点累，工作质量差不多","几乎没差，睡一觉就完全复原"]},{"t":"得了一场需要躺着的重感冒，从最严重到恢复正常上班，通常要多久？","o":["两周以上，还常留下咳嗽尾巴","约十天","约一周","三四天","一两天就自己好了"]},{"t":"运动中把脚踝扭了一下（不严重），你的第一反应是？","o":["痛到当场停下，剩下的进程全取消","很痛，得休息很久才愿意再动","休息几分钟，再看情况","稍微确认没事就继续，赛后才处理","当下几乎没感觉，事后看到瘀青才想起来"]},{"t":"需要手上很稳的活（穿针、贴手机膜、剪指甲），你的表现是？","o":["几乎做不好，通常请人代劳","做得到但常失败，要重来很多次","慢慢来可以做好","做得又快又好","这类事情大家都直接找你做"]},{"t":"玩需要瞄准的游戏（射击、丢飞镖、投篮），你的命中状况是？","o":["完全抓不到准头","偶尔中，多半靠运气","练一下能到平均水平","一开始就比多数人准","几乎一上手就很准，别人会以为你有练过"]},{"t":"杯子从桌边滑下去的那一瞬间，你通常？","o":["看着它落地，完全来不及反应","手伸出去了，但已经摔了","偶尔接得到","多半接得到","几乎每次都接住，而且没洒出来"]},{"t":"眼看地铁门要关了，还有一段距离，你冲过去的结果通常是？","o":["根本不会冲，直接放弃等下一班","会冲但赶不上","一半一半","多半赶得上","几乎都赶得上，而且上车后不用喘"]},{"t":"在外面走走逛逛一整天（约八小时），到晚上你的状态是？","o":["下午就撑不住，只想找地方坐","晚上脚很痛，隔天也起不来","会累，但回家休息就好","还行，晚上还能再安排活动","几乎没感觉，明天再来一天也可以"]},{"t":"帮朋友搬家，需要搬一箱二十公斤的书上三楼，你会？","o":["搬不动，只能负责顾东西","要两个人一起抬","自己搬得动，但要中途休息","一口气搬上去","一次搬两箱，还会被叫去搬冰箱"]},{"t":"公交车已经开了，你在后面追那十几秒，是什么感觉？","o":["起步就跑不动，直接放弃","跑得起来但很快就没力","能追上一小段","冲刺得很有效，通常追得上","一瞬间就加到最高速"]},{"t":"办公室或家里有人重感冒，接下来一周你通常？","o":["一定被传染，而且比对方还严重","多半会中","看情况，一半概率","很少被传染","几乎不会，周围倒一片你也没事"]},{"t":"连续放假一周、完全不设闹钟，你的作息会变成？","o":["整个颠倒，天亮才睡","愈拖愈晚，每天往后两小时","比平常晚一两小时就稳定下来","跟平常差不多","几乎完全一样，时间到就自然醒"]},{"t":"冬天洗到偏冷的水、或夏天待在闷热没空调的房间，你的反应是？","o":["完全受不了，什么事都做不了","很不舒服，会一直想着这件事","不舒服但能忍一段时间","还好，不太影响手上的事","几乎不受影响，别人喊苦你没感觉"]},{"t":"盘腿坐在地上，你的状况是？","o":["根本盘不起来，膝盖离地很高","勉强盘住，一两分钟就麻","可以坐十几分钟","很轻松，坐一小时没问题","能盘得很低很稳，甚至单盘双盘都可以"]},{"t":"第一次玩滑板、溜冰或冲浪这类要平衡的活动，你的第一天是？","o":["完全站不起来，全程扶着","能站住但一动就摔","练半天能慢慢滑","很快就上手，能自己移动","第一天就玩得比旁边练很久的人好"]},{"t":"喝到不同品牌但同类型的饮料（例如两款黑咖啡），你能分辨吗？","o":["完全喝不出差别","要差很多才喝得出来","喝得出不一样，但说不出差在哪","能说出酸苦浓淡的差别","能讲出产地或烘焙程度这种细节"]},{"t":"双手提着两袋沉重的采买物，要走十分钟回家，你会？","o":["走不到一半就得放下，或干脆叫车","要停下来休息两三次","中间换手一次就能到","一路提回去，到家有点酸","完全没感觉，还能顺便再拎一袋"]},{"t":"需要手保持不动的时候（拿相机、端满的汤、对焦），你的手会？","o":["明显抖，常常会洒出来或糊掉","撑几秒就开始抖","还算稳，久了会抖","很稳，可以维持不短的时间","非常稳，别人会拿你的手当三脚架"]},{"t":"连续讲话一小时（上课、报告、带团）之后，你的喉咙是？","o":["完全哑掉，隔天都讲不出话","很沙哑，要休息半天","有点干，喝水就好","没什么感觉","完全没影响，可以再讲一小时"]},{"t":"看到别人抓拍、没有摆姿势的自己的照片，你的第一反应通常是？","o":["很难接受，会请对方删掉","不太满意，觉得跟镜子里差很多","还好，就是普通","通常还不错","多半都好看，朋友也常拿去用"]},{"t":"从正面看，你的肩膀宽度相对腰部是？（判定体型倾向）","o":["肩窄、腰也细，整体像直筒偏细长","肩比腰宽一点，但整体偏薄","一般比例，没特别宽也没特别窄","肩明显比腰宽，接近倒三角","肩腰差不多宽，整体偏厚实圆润"]},{"t":"在你没有规律运动的时期，身体摸起来的质地是？（判定体型倾向）","o":["很瘦，摸得到骨头，肉很少","偏瘦，但肌肉软、没什么线条","普通，不软也不硬","没特别运动也摸起来挺结实的","偏软，捏起来大多是脂肪"]},{"t":"连续几天的体力活之后（搬家、搬货、体力打工），你的身体会？（判定体型倾向）","o":["只有酸痛，体格看不出任何变化","手臂会紧一点，过几天就恢复原样","没什么特别感觉，跟平常差不多","几天下来手臂、肩膀会明显变紧实","会变壮，但同时也容易变厚变重"]}],"b3":[{"t":"重要项目做到一半，内核需求变了，之前的工作大部分作废。你的真实反应更接近？","o":["照做，但会明显消极一段时间","立刻开始想新方案，但心里憋着一股火","有点兴奋，觉得新方向说不定更好","马上冷静下来，先搞清楚为什么变，再动手","需要缓两天才能重新投入"]},{"t":"你想读懂一本重要但明显超出你程度的书，读了三十页完全看不懂。你会？","o":["边读边查，速度很慢但每页都弄懂","先去找一本入门书垫底，再回来读","放着，等 。你的第一反应是？","o":["会去看是谁做的研究、样本多大","很好，那应该多做","直觉觉得这数字有点夸张","没想那么多，看过就过了","想知道原本的风险是多少，50% 的基数是什么"]},{"t":"一件你完全没兴趣、但非做不可的事，做了两小时还剩很多。","o":["设置二十五分钟一段，硬做完","跟自己谈条件，做完就去做想做的事","找个理由让自己觉得有意思，就做得下去","换到咖啡厅或图书馆，环境一换就做得动","一直分心，实际做的时间很少"]},{"t":"团队里有人明显在混，而你们的成果是绑在一起的。","o":["跟其他人抱怨，但不会直接处理","直接跟他说进度必须跟上","自己把他的部分做掉，比较快","往上报，让有权责的人处理","私下找他谈，先问是不是遇到什么事"]},{"t":"第一次照着食谱做一道有点难度的菜。","o":["看过一遍就凭感觉做，成品时好时坏","做到一半发现漏看步骤，只好将错就错","太复杂就放弃，改叫外卖","照做，但缺的材料会找东西替代","完全照步骤，克数时间都精准照做"]},{"t":"晚上正在做事，突然整栋停电。","o":["先确认是不是只有自己家，再判断要不要出门","愣了几秒，等别人先动","觉得烦，就直接去睡","有点慌，会先打电话问人","马上拿手电筒，先把重要的东西处理好"]},{"t":"你决定学一个新乐器，练了一个月还很难听。","o":["改练简单一点的曲子，先做到能听","每天固定练，难听也照练","发现自己抓得到音准，只是手还跟不上","开始怀疑是不是乐器或老师的问题","觉得自己没天份，慢慢就不练了"]},{"t":"一条你走过两三次的路，再走一次。","o":["完全记得，连哪个转角有什么店都记得","大方向记得，细节要看到才想起来","每次都像第一次走","要开导航，但不会走错","记得地标，但方向感很差"]},{"t":"有人花十分钟跟你讲一个很复杂的计划。讲完之后你？","o":["点头说懂了，其实没有","抓得到主轴，细节记不住","能复述一遍，还能指出哪里没讲清楚","中途就跟丢了，只记得最后一句","听的时候就觉得哪里怪怪的"]},{"t":"你看到一个东西（一首歌、一张照片、一个设计）觉得很好。","o":["会去找作者的其他作品来看","知道自己喜欢，但讲不出理由","觉得好看就好，不会多想","说得出好在哪，甚至能拆给别人听","会想这样做出来要花多少工夫"]},{"t":"你看到一件明显不公平的事，受害者不是你。","o":["事后私下去关心当事人","会记下来，之后在能发声的场合讲","先确认状况，再决定怎么帮比较有效","当场介入","很生气，但觉得不关自己的事"]},{"t":"连续三天完全一个人，不跟任何人说话。","o":["会很难受，一定会想办法找人","会拿来做平常没空做的事","很享受，这是我恢复能量的方式","根本不会注意到时间过了","第一天很好，第二天开始闷"]},{"t":"你正在讲的内容，讲到一半发现听众完全没兴趣。","o":["照原本的讲完，反正时间有限","问一个问题，把他们拉回来","当场跳过中段，直接讲结论","其实不太会发现这件事","讲快一点，赶快结束"]},{"t":"你对自己承诺了一件事（早起、戒某个习惯），没有任何人知道。","o":["我知道自己需要有人看着，所以会告诉别人","撑一阵子，然后悄悄放弃","会做，但会给自己很多例外","多半当天就忘了","照样做到，跟有没有人看无关"]},{"t":"别人话讲到一半，你已经知道他要说什么了。","o":["会忍住让他讲完","会提前想好怎么回，反而漏听后半段","会，但也常常猜错","很少发生，我通常要听完才懂","常常会接话或打断"]},{"t":"要从二十几个差不多的选项里挑一个（租房、机票、方案）。","o":["看前五个，觉得可以就决定","订三个条件，不符合的直接删掉","问一个信得过的人，照他说的做","每一个都看仔细，花很久","看到最后反而更难决定，干脆先不选"]},{"t":"朋友在你面前哭了。","o":["跟他说别想太多，会过去的","问发生什么事，想帮他解决","安静陪着，递纸巾，不急着讲话","很不知所措，会有点僵","自己也会跟着鼻酸"]},{"t":"同期的人做出了明显比你好的成果。","o":["会拿来当自己的目标和期限","会去研究他怎么做到的","羡慕，但觉得跟自己没关系","心里不舒服好一阵子","会想他大概有什么我没有的条件"]},{"t":"你被指派了一个从没做过、也不太符合你性格的角色。","o":["先答应，边做边学","接下来但很焦虑，做得绑手绑脚","觉得不适合，会想办法推掉","找一个做过的人请教，照着他的方法做","会先问清楚要做到什么程度再决定"]},{"t":"一个要花两三年才看得到成果的目标。","o":["知道自己撑不了那么久，所以不会设这种目标","凭一股劲做，通常半年后就淡了","会做，但进度完全看当时的状态","会拆成季度和月的小目标，逐一推进","目前手上就有一件做超过两年的事"]},{"t":"你被人误解了，而且那个误解正在传开。","o":["先找关键的那个人说明","很在意，会反复想每个人怎么看我","会生气地反击，语气可能过头","不解释，时间久了自然会清楚","马上把事实讲清楚，一次讲到位"]},{"t":"一件你投入很久的事，连续几个月都没有进展。","o":["找人聊，看看是不是自己盲点","开始怀疑自己适不适合做这个","慢慢就不碰了，也没正式放弃","停下来重新检查方法，可能整个换做法","继续做，相信量变会有质变"]},{"t":"第一次玩一个规则复杂的桌游。","o":["重点是气氛，输赢无所谓，一直在贫嘴","先玩一局熟悉，第二局才认真","听完规则就大概知道该往哪个方向赢","会冒险用没人试过的打法","规则没完全听懂，跟着别人做"]},{"t":"对于既有的规则和做法，你的态度比较接近？","o":["会找规则的边界，在里面绕出新路","先照做，理解为什么这样订之后再谈改","照着做最安全，改动风险太大","心里不认同，但表面照做","看到不合理就会想改，也真的去改"]}],"b4":[{"t":"过去一年，你当初说要做超过一个月的事，实际做完了几件？","o":["一件也没有","有一件，而且拖了很久","大概一半","多数都完成了","全部完成，而且大致照原订时间"]},{"t":"认识你的人如果要形容你的情绪，最可能怎么说？","o":["起伏很大，大家会看你脸色","平常还好，压力一来就明显","跟大多数人差不多","很少看他生气","出事时反而是最镇定的那个"]},{"t":"过去半年，你因为分心或忘记而错过已排定的事，有几次？","o":["很多次，几乎每个月都有","四五次","两三次","一次","完全没有"]},{"t":"身边的人心情不好时，来找你讲的频率是？","o":["从来没有","很少","偶尔","经常","我是很多人第一个想到的人"]},{"t":"你上一次主动学一个跟工作、学业都无关的新东西，是什么时候？","o":["想不起来","好几年前","大概一年前","最近几个月","现在就在学"]},{"t":"你跟别人解释一件复杂的事，对方真的听懂的比例大概是？","o":["很低，通常要讲很多次还是不懂","不到一半","一半左右","多数人听得懂","常有人说你讲得比原本的人清楚"]},{"t":"过去一年，你在五人以上的场合正式发言或报告了几次？","o":["零次，会刻意避开","一两次，被指定的","三五次","很多次，算是常态","经常，而且常是我主动要来的"]},{"t":"一群人要有人出来统筹时，最后变成你的频率？","o":["从来不会，我也不想","很少","偶尔，没人做的时候","经常","几乎每次，大家会直接看着我"]},{"t":"别人评价你的点子时，最常出现的说法是？","o":["很少听到有人评价我的点子","说我想的比较实际、保守","跟大家差不多","说我常想到别人没想到的角度","说我点子很多，有些还很怪"]},{"t":"朋友要挑餐厅、挑衣服、挑礼物时，来问你意见的频率？","o":["没有人问我这种事","很少","偶尔","经常","常常，甚至会直接请我帮忙决定"]},{"t":"你唱歌时，音准的实际状况是（以录音或别人的反应为准）？","o":["明显走音，自己也听不出来","常走音，但自己听得出来","大致在调上","音准稳，被说唱得不错","能抓和声，或听一遍就能跟着唱准"]},{"t":"看过一次的六位数验证码，你能记住多久？","o":["看完切换画面就忘了","要看两三次才输得进去","看一次能输完","几分钟后还记得","隔一段时间都还记得"]},{"t":"你预估一件事要多久，跟实际花的时间比起来？","o":["实际常常是预估的两三倍以上","通常会超过一半左右","会超过一点","相当接近","很准，甚至常常提早完成"]},{"t":"在一栋没去过的大楼里找厕所或出口，你的状况是？","o":["一定迷路，得问人","要看指针才找得到","稍微绕一下就找到","很快，方向感不太会错","进门大概就知道格局，直接走过去"]},{"t":"你实际用非母语沟通的情况是？","o":["完全没办法对话","只能讲单字和背过的句子","能应付点餐问路，复杂的就卡住","能聊天，也能处理一般事务","能用它工作、开会或吵架"]},{"t":"过去一年，身体状况（生病、太累、失眠）影响到你工作或学业的次数？","o":["很多次，几乎每个月都有","五六次","三四次","一两次","完全没有"]},{"t":"你上一次运动到隔天走路会痛，是什么时候？","o":["想不起来，因为我根本不运动","好几年前","几个月前，那次之后就没再运动","最近一两个月，偶尔会这样","最近才有，因为我常在练到极限"]},{"t":"别人对你的反应速度，最常出现的评语是？","o":["常被说慢半拍、还在状况外","偶尔会被催","没人特别提过","被说反应很快","常被说你怎么反应这么快"]},{"t":"回头看你最近一次计划被打乱的经验，事后你的评价是？","o":["处理得很糟，而且当时完全没意识到","处理得不好，事后才想到该怎么做","还行，该做的有做到","处理得不错，当下就知道要先做什么","很好，而且清楚知道自己为什么能这样反应"]},{"t":"你的朋友圈里，负责让大家笑的是谁？","o":["绝对不是我，我常听不懂笑点","不是我，我是笑的那个","看场合，偶尔是我","常常是我","我是，而且没有我气氛会冷掉"]},{"t":"听到自己说话的录音时（例如语音频息），你的感觉是？","o":["完全无法接受，会避免留语音","不太喜欢，觉得跟自己听到的差很多","还好，就是普通","觉得还不错","很喜欢，别人也常夸"]},{"t":"在照片或视频里，你的外形在一群人中的辨识度是？","o":["很低，常被说没印象","不太起眼","普通","很容易被认出来","一眼就会被注意到"]}]},"tpre":{"P":"暴烈","E":"不眠","A":"疾风","C":"精密","K":"洞察","R":"异想","X":"果决","S":"共鸣"},"title":{"EP":{"n":"野兽","tag":"出力大，而且耗不完","d":"纯粹靠身体就能解决的问题都绕不过你——搬、扛、撑、跑，别人分两天做的体力活你一次做完。弱点在于一旦问题需要的是巧劲、精度或谈判，你的优势完全用不上，这种时候该找人搭配，而不是硬上。"},"AP":{"n":"冲锋者","tag":"又快又猛，正面撞开","d":"起跑、抢点、第一时间冲进去的场合是你的主场，反应和爆发同时到位，别人还在判断你已经动了。代价是续航跟不上这股猛劲，长期消耗战会让你在后半段崩掉，任务要挑短而密集的。"},"CP":{"n":"铁手","tag":"力气很大，但手很稳","d":"又要出力又要精准的活最适合你——搬运易碎品、操作重机具、需要手感的体力工作，这种组合比纯力气稀有得多。真正吃力的是要靠说服与协调推进的事，你的长处在手上而不在嘴上。"},"AE":{"n":"猎手","tag":"追得久，也闪得掉","d":"跟得住、耗得起、又不会被突发状况甩开，长时间需要保持警觉的场合你最可靠。不擅长的是需要一次爆发把事情顶过去的关口，你的优势是慢慢磨，不是瞬间拉满。"},"CE":{"n":"守夜人","tag":"熬得住，也察觉得到","d":"长时间维持专注与精度而不掉水平，值夜、监控、精细长工时的事别人做两小时就散掉，你能撑完全程。代价是节奏偏慢，需要立刻反应或立刻决断的场面会显得迟。"},"AC":{"n":"神枪手","tag":"快，而且准","d":"反应快和手稳通常互斥，在你身上同时成立，需要在极短时间内做出精确动作的事几乎没有对手。弱点是耐力与力量撑不起长时间高强度，你适合关键的那一下，不适合整场消耗。"},"KP":{"n":"破壁者","tag":"想得透，也撞得开","d":"面对卡住的问题，你既能拆解它的结构，也有硬推过去的本钱，不会停在“想清楚了但推不动”。要小心的是这两种手段都偏向强攻，遇到需要迂回、等待或安抚人心的局面容易用力过猛。"},"PR":{"n":"锻造狂想家","tag":"想得出来，也做得出来","d":"点子加上把它实体化的体力，你是那种真的会动手把脑中的东西造出来的人，不只是提案。难处在于执行的节奏与收尾，作品很常做到一半就换了新念头。"},"PX":{"n":"攻城槌","tag":"认定了就推到底","d":"决定要做的事会被你用纯粹的推力顶过去，体力和意志同时撑着，很少有事情能让你中途停下。风险是方向错了也一样推得很远，开工前多花十分钟确认目标，回报比多推一小时大得多。"},"PS":{"n":"先锋队长","tag":"自己先上，别人才跟上","d":"你靠身体力行带动别人，在需要有人第一个站出来的场合特别有效，说服力来自你真的做了。相对弱的是拆解与规划，方向由别人定、由    每個填空題 2 bytes（值 ×10，0xFFFF = 未答）+ 選擇題以 6 進位
   三個一組塞進 1 byte（0 = 未答，1–5 = 選項 A–E）。
   版本與題數對不上就拒絕還原——題庫一動，舊碼的題號就位移了。
   ========================================================= */
const CODE_VER = 2;                 /* 與 KEY 的版本號同步遞增 */
const C64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

function c64e(bytes){
  let out = "", buf = 0, bits = 0;
  for(const b of bytes){
    buf = (buf << 8) | b; bits += 8;
    while(bits >= 6){ bits -= 6; out += C64[(buf >> bits) & 63]; }
  }
  if(bits) out += C64[(buf << (6-bits)) & 63];
  return out;
}
function c64d(str){
  const out = []; let buf = 0, bits = 0;
  for(const ch of String(str)){
    const v = C64.indexOf(ch);
    if(v < 0) continue;
    buf = (buf << 6) | v; bits += 6;
    if(bits >= 8){ bits -= 8; out.push((buf >> bits) & 255); }
  }
  return out;
}

function encodeAns(ans){
  const bytes = [CODE_VER, (ALLQ.length >> 8) & 255, ALLQ.length & 255];
  const digits = [];
  ALLQ.forEach((q,i)=>{
    const a = ans[i];
    if(q.type === "num"){
      const ok = typeof a === "number" && isFinite(a);
      const v = ok ? Math.max(0, Math.min(65534, Math.round(a*10))) : 65535;
      bytes.push((v >> 8) & 255, v & 255);
    } else {
      digits.push(typeof a === "number" && a >= 0 && a < 5 ? a+1 : 0);
    }
  });
  for(let i = 0; i < digits.length; i += 3){
    bytes.push(digits[i] + (digits[i+1]||0)*6 + (digits[i+2]||0)*36);
  }
  return c64e(bytes);
}

function decodeAns(code){
  const b = c64d(String(code).trim());
  if(b.length < 3 || b[0] !== CODE_VER) return null;
  if(((b[1] << 8) | b[2]) !== ALLQ.length) return null;
  const ans = {}, choices = [];
  let p = 3;
  for(let i = 0; i < ALLQ.length; i++){
    if(ALLQ[i].type === "num"){
      if(p+1 >= b.length) return null;
      const v = (b[p] << 8) | b[p+1]; p += 2;
      if(v !== 65535) ans[i] = v/10;
    } else choices.push(i);
  }
  if(b.length - p < Math.ceil(choices.length/3)) return null;
  for(let k = 0; k < choices.length; k++){
    const d = Math.floor(b[p + Math.floor(k/3)] / Math.pow(6, k%3)) % 6;
    if(d > 0) ans[choices[k]] = d - 1;
  }
  return ans;
}

/* =========================================================
   自評回收
   純靜態站，沒有自己的後端：把「壓縮碼 + 分數」送進一份 Google 表單，
   在表單的「回覆」分頁就能看到。填好下面三個值即可啟用；留空則只存本機。
     id   —— 表單網址 .../forms/d/e/<這一段>/viewform
     code / rate —— 兩題的欄位 ID，在預填網址裡是 entry.123456789
   ========================================================= */
const FORM = {
  id:   "1FAIpQLScj01fjnlPXNfWPvqjP01oXxsYNvnHBjzReXvqI0R5x8WBbdg",
  code: "entry.992992464",   /* 壓縮碼 */
  rate: "entry.846993818"    /* 自評分數 */
};
function formReady(){ return !!(FORM.id && FORM.code && FORM.rate); }
function sendRating(code, n){
  if(!formReady()) return Promise.reject(new Error("form not configured"));
  const body = new URLSearchParams();
  body.set(FORM.code, code);

/* =========================================================
   歷史記錄
   只存摘要與壓縮碼，面板本身在點開時由壓縮碼重算。
   ========================================================= */
const HKEY = "panel42.hist";
const HIST_MAX = 30;

function histLoad(){
  try{
    const a = JSON.parse(localStorage.getItem(HKEY));
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}
function histSave(list){
  try{ localStorage.setItem(HKEY, JSON.stringify(list.slice(0, HIST_MAX))); }catch(e){}
}
function histAdd(res, code){
  const list = histLoad();
  if(list.some(h => h.code === code)) return;   /* 同一份答案不重複記錄 */
  const ti = titleOf(res);
  const avg = a => Math.round(a.reduce((x,y)=>x+y.v,0)/a.length);
  list.unshift({
    ts: Date.now(), code: code,
    ttl: ti.key, pre: ti.pre,
    hw: avg(res.groups.filter(g=>g.d==="hw")),
    sw: avg(res.groups.filter(g=>g.d==="sw")),
    rel: res.reliability, rate: 0
  });
  histSave(list);
}
function histRate(code, n){
  const list = histLoad();
  const h = list.find(x => x.code === code);
  if(!h) return;
  h.rate = n;
  histSave(list);
}

function histWhen(ts){
  try{
    return new Date(ts).toLocaleDateString(t("htmlLang"),
      {year:"numeric", month:"2-digit", day:"2-digit"});
  }catch(e){ return new Date(ts).toISOString().slice(0,10); }
}
function histTitleName(h){
  return TITLES[h.ttl] ? titleName({key:h.ttl, pre:h.pre}) : "—";
}

function renderHist(){
  const list = histLoad();
  const host = $("#hist-list");
  $("#hist").hidden = list.length === 0;
  host.innerHTML = "";
  list.forEach(h=>{
    const item = document.createElement("div");
    item.className = "hist-item";

    const row = document.createElement("button");
    row.className = "hist-row";
    const when = document.createElement("span");
    when.className = "when"; when.textContent = histWhen(h.ts);
    const who = document.createElement("span");
    who.className = "who"; who.textContent = histTitleName(h);
    const stat = document.createElement("span");
    stat.className = "stat";
    stat.textContent = t("hwName") + " " + h.hw + " · " + t("swName") + " " + h.sw +
                       " · " + t("calRel") + " " + h.rel;
    row.append(when, who, stat);
    if(h.rate){
      const rt = document.createElement("span");
      rt.className = "rate-tag"; rt.textContent = fmt(t("histRate"), {n:h.rate});
      row.appendChild(rt);
    }
    row.onclick = ()=>viewHist(h);

    const del = document.createElement("button");
    del.className = "hist-del"; del.textContent = "×";
    del.title = t("histDel"); del.setAttribute("aria-label", t("histDel"));
    del.onclick = ()=>{ histSave(histLoad().filter(x => x.code !== h.code)); renderHist(); };

    item.append(row, del);
    host.appendChild(item);
  });
}

function next(){ save(); state.i++; if(state.i >= ALLQ.length){ finish(); } else { renderQ(); save(); } }
function back(){ if(state.i > 0){ state.i--; renderQ(); save(); } }

document.addEventListener("keydown", e=>{
  if(!$("#s-quiz").classList.contains("on")) return;
  if(e.target.tagName === "INPUT") return;
  const q = ALLQ[state.i];
  if(!q || q.type === "num") return;
  let k = -1;
  if(e.key >= "1" && e.key <= "5") k = +e.key - 1;
  const up = e.key.toUpperCase();
  if(LETTERS.indexOf(up) >= 0) k = LETTERS.indexOf(up);
  if(k >= 0 && k < q.o.length){ e.preventDefault(); state.ans[state.i] = k; next(); }
  if(e.key === "ArrowLeft" || e.key === "Backspace"){ e.preventDefault(); back(); }
});

/* =========================================================
   計分（與語言無關）
   ========================================================= */
function score(){
  const acc = {}, soma = {_ecto:0,_meso:0,_endo:0};
  const bucket = k => k==="b1" ? "obj" : (k==="b4" ? "cross" : "self");
  let picked = 0, maxPicked = 0;

  ALLQ.forEach((q,ix)=>{
    const a = state.ans[ix];
    if(a === undefined) return;
    if(q.type === "num") return;
    const op = q.o[a];
    if(!op) return;
    const b = bucket(q.blk);

    const tot = o => Object.entries(o.s).reduce((n,[k,v]) => k[0]==="_" ? n : n+v, 0);
    const best = Math.max.apply(null, q.o.map(tot));
    if(tot(op) > 0){ picked++; if(tot(op) === best) maxPicked++; }

    for(const [k,v] of Object.entries(op.s)){
      if(k[0] === "_"){ soma[k] += v; continue; }
      (acc[k] = acc[k] || {obj:[],self:[],cross:[]})[b].push(v);
    }
  });

  const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;

  let diffs = [];
  for(const [k,v] of Object.entries(acc)){
    const s = mean(v.self), anchor = mean(v.obj.concat(v.cross));
    if(s !== null && anchor !== null) diffs.push(s - anchor);
  }
  const bias = diffs.length ? diffs.reduce((a,b)=>a+b,0)/diffs.length : 0;
  const spread = diffs.length ? diffs.reduce((a,b)=>a+Math.abs(b),0)/diffs.length : 0;
  const extremity = picked ? maxPicked/picked : 0;

  const dims = {};
  for(const k of Object.keys(DIM)){
    const v = acc[k];
    if(!v){ dims[k] = {v:50, n:0, raw:3}; continue; }
    const s = mean(v.self), anchor = mean(v.obj.concat(v.cross));
    let raw;
    if(s !== null && anchor !== null) raw = 0.45*s + 0.55*anchor;
    else if(s !== null) raw = s - Math.max(-0.8, Math.min(0.8, 0.6*bias));
    else raw = anchor;
    dims[k] = {
      v: Math.max(0, Math.min(100, Math.round((raw-1)/4*100))),
      n: v.obj.length + v.self.length + v.cross.length,
      raw: raw
    };
  }

  const groups = GROUPS.map((g,gi)=>{
    const vals = g.dims.map(d=>dims[d].v);
    return Object.assign({}, g, {gi:gi, v: Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)});
  });

  // 體型傾向：只存 key，文字在繪製時才決定，才能跟著語言切換
  const sTot = soma._ecto + soma._meso + soma._endo || 1;
  const parts = [["Ecto",soma._ecto],["Meso",soma._meso],["Endo",soma._endo]].sort((a,b)=>b[1]-a[1]);
  const somaLead = parts[0][0], somaSecond = parts[1][0];
  const somaMix = (parts[0][1]-parts[1][1])/sTot < 0.18;

  const h = state.ans[0], w = state.ans[1];
  let bmi = null, bmiKey = null;
  if(h && w){
    bmi = w / Math.pow(h/100, 2);
    bmiKey = bmi < 18.5 ? "bmi1" : bmi < 24 ? "bmi2" : bmi < 27 ? "bmi3" : "bmi4";
  }

  const exPen = Math.pow(Math.max(0, extremity-0.35), 1.3) * 95;
  const reliability = Math.max(30, Math.min(99, Math.round(100 - spread*20 - exPen)));

  return {dims, groups, bias, spread, extremity, somaLead, somaSecond, somaMix,
          bmi, bmiKey, reliability, h, w};
}

/* =========================================================
   稱號判定
   前二名 -> 稱號本體，第三名 -> 前綴。
   第 1 與第 3 的差距 < TTL_FLAT 時視為沒有形狀，改判 GEN（不帶前綴）。
   同分時以主屬性的固定順序 tie-break，確保同一份答案永遠得到同一個稱號。
   ========================================================= */
const TTL_FLAT = 4;

function titleOf(res){
  const g = res.groups.map((x,i)=>({k:x.k, v:x.v, gi:i})).sort((a,b)=>b.v-a.v || a.gi-b.gi);
  const top = g.slice(0,3);
  if(g[0].v - g[2].v < TTL_FLAT) return {key:"GEN", pre:null, top:top};
  return {key:[g[0].k,g[1].k].sort().join(""), pre:g[2].k, top:top};
}
function titleT(key, f){
  const p = pack();
  return (p && p.title && p.title[key] && p.title[key][f]) || TITLES[key][f];
}
function tpreT(k){
  const p = pack();
  return (p && p.tpre && p.tpre[k]) || TPRE[k];
}
function titleName(ti){
  return ti.pre
    ? fmt(t("ttlFmt"), {p:tpreT(ti.pre), n:titleT(ti.key,"n")})
    : fmt(t("ttlFmtNone"), {n:titleT(ti.key,"n")});
}

function renderTitle(res){
  const ti = titleOf(res);
  const nm = $("#t-name");
  nm.innerHTML = "";
  /* 依語言的格式字串組裝，前綴獨立成 span 以便上色；不用 innerHTML，避免注入 */
  const f = ti.pre ? t("ttlFmt") : t("ttlFmtNone");
  const re = /\{(p|n)\}/g;
  let last = 0, m;
  while((m = re.exec(f)) !== null){
    if(m.index > last) nm.append(document.createTextNode(f.slice(last, m.index)));
    if(m[1] === "p"){
      const pre = document.createElement("span");
      pre.className = "pre";
      pre.textContent = tpreT(ti.pre);
      nm.appendChild(pre);
    } else {
      nm.append(document.createTextNode(titleT(ti.key,"n")));
    }
    last = m.index + m[0].length;
  }
  if(last < f.length) nm.append(document.createTextNode(f.slice(last)));
  $("#t-tag").textContent = titleT(ti.key,"tag");
  $("#t-desc").textContent = titleT(ti.key,"d");
  const axes = $("#t-axes");
  axes.innerHTML = "";
  ti.top.forEach((g,i)=>{
    const el = document.createElement("span");
    el.className = "t-ax" + (i === 0 ? " n1" : "");
    const dot = document.createElement("i");
    dot.style.background = GROUPS[g.gi].d === "hw" ? "var(--hw)" : "var(--sw)";
    const nmx = document.createElement("span"); nmx.textContent = grpT(g.gi);
    const vv = document.createElement("b"); vv.textContent = g.v;
    el.append(dot, nmx, vv);
    axes.appendChild(el);
  });
  $("#titlecard").setAttribute("aria-label", titleName(ti));
}

/* =========================================================
   雷達圖
   ========================================================= */
function drawRadar(groups){
  const svg = $("#radar");
  const CX = 260, CY = 200, R = 132;
  const N = groups.length;
  const ang = i => (-90 + i*(360/N)) * Math.PI/180;
  const pt = (i, r) => [CX + Math.cos(ang(i))*r, CY + Math.sin(ang(i))*r];
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  let out = "";

  [25,50,75,100].forEach(lv=>{
    const p = groups.map((_,i)=>pt(i, R*lv/100).map(n=>n.toFixed(1)).join(",")).join(" ");
    out += '<polygon points="' + p + '" style="fill:none;stroke:var(--rule);stroke-width:1' +
           (lv===50 ? ';stroke-dasharray:3 3' : '') + '" />';
  });
  groups.forEach((g,i)=>{
    const [x,y] = pt(i,R);
    out += '<line x1="'+CX+'" y1="'+CY+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+
           '" style="stroke:var(--rule);stroke-width:1" />';
  });
  ["hw","sw"].forEach(dom=>{
    const idx = groups.map((g,i)=>g.d===dom?i:-1).filter(i=>i>=0);
    const a0 = ang(idx[0]) - (Math.PI/N), a1 = ang(idx[idx.length-1]) + (Math.PI/N);
    const rr = R + 15;
    const p0 = [CX+Math.cos(a0)*rr, CY+Math.sin(a0)*rr];
    const p1 = [CX+Math.cos(a1)*rr, CY+Math.sin(a1)*rr];
    out += '<path d="M '+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A '+rr+' '+rr+' 0 0 1 '+
           p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'" style="fill:none;stroke:var('+
           (dom==="hw"?"--hw":"--sw")+');stroke-width:2.5;stroke-linecap:round;opacity:.55" />';
  });
  const dp = groups.map((g,i)=>pt(i, R*Math.max(g.v,2)/100).map(n=>n.toFixed(1)).join(",")).join(" ");
  out += '<polygon points="'+dp+'" style="fill:var(--sw-fill);stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round" />';
  groups.forEach((g,i)=>{
    const [x,y] = pt(i, R*Math.max(g.v,2)/100);
    const c = g.d==="hw" ? "var(--hw)" : "var(--sw)";
    out += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4.5" style="fill:'+c+
           ';stroke:var(--surface);stroke-width:2" />';
    const [lx,ly] = pt(i, R+36);
    const cs = Math.cos(ang(i));
    const anchor = Math.abs(cs) < 0.3 ? "middle" : (cs > 0 ? "start" : "end");
    out += '<text class="ax" x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+anchor+
           '">'+esc(grpT(g.gi))+'</text>';
    out += '<text class="axn" x="'+lx.toFixed(1)+'" y="'+(ly+20).toFixed(1)+'" text-anchor="'+anchor+
           '" style="fill:'+c+'">'+g.v+'</text>';
    out += '<circle class="hit" data-i="'+i+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+
           '" r="17" style="fill:transparent;cursor:pointer" />';
  });
  svg.innerHTML = out;
  $("#radar-desc").textContent = groups.map(g=>grpT(g.gi)+" "+g.v).join(", ");

  const tip = $("#tip"), wrap = $("#radar-wrap");
  svg.querySelectorAll(".hit").forEach(el=>{
    const show = ()=>{
      const g = groups[+el.dataset.i];
      tip.innerHTML = "";
      tip.append(document.createTextNode(grpT(g.gi)));
      const v = document.createElement("span"); v.className = "v"; v.textContent = g.v;
      tip.appendChild(v);
      const r = wrap.getBoundingClientRect(), b = el.getBoundingClientRect();
      tip.style.left = (b.left - r.left + b.width/2) + "px";
      tip.style.top  = (b.top - r.top) + "px";
      tip.style.opacity = 1;
    };
    el.addEventListener("mouseenter", show);
    el.addEventListener("focus", show);
    el.addEventListener("mouseleave", ()=>tip.style.opacity = 0);
    el.addEventListener("blur", ()=>tip.style.opacity = 0);
    el.setAttribute("tabindex","0");
  });
}

/* =========================================================
   結果頁
   ========================================================= */
function band(v){ return v >= 62 ? "h" : (v <= 38 ? "l" : "m"); }

function dimRow(k, d){
  const c = DIM[k].d === "hw" ? "var(--hw)" : "var(--sw)";
  const el = document.createElement("div");
  el.className = "dim";
  const top = document.createElement("div");
  top.className = "dim-top";
  const nm = document.createElement("span"); nm.className = "dim-nm"; nm.textContent = dimT(k,"n");
  const tr = document.createElement("div"); tr.className = "dim-track";
  const fill = document.createElement("i"); fill.style.background = c; fill.dataset.w = d.v;
  tr.appendChild(fill);
  const vv = document.createElement("span"); vv.className = "dim-val"; vv.textContent = d.v;
  top.append(nm, tr, vv);
  const say = document.createElement("p");
  say.className = "dim-say"; say.textContent = dimT(k, band(d.v));
  const ex = document.createElement("p");
  ex.className = "dim-ex"; ex.textContent = t("dimEx") + dimT(k,"ex");
  el.append(top, say, ex);
  return el;
}

/* ---------- 具體場景 ---------- */
function sceneScores(dims){
  const sep = LANG === "en" ? ", " : "・";
  return SCENES.map((sc,si)=>{
    let sum = 0, wt = 0, hw = 0, sw = 0;
    const parts = [];
    for(const [k,w] of Object.entries(sc.w)){
      sum += dims[k].v * w; wt += w;
      if(DIM[k].d === "hw") hw += w; else sw += w;
      parts.push([k,w]);
    }
    parts.sort((a,b)=> b[1]-a[1] || dims[b[0]].v - dims[a[0]].v);
    return {
      i: si,
      n: sceneT(si),
      v: Math.round(sum/wt),
      dom: hw > sw ? "hw" : "sw",
      why: parts.slice(0,3).map(([k])=>dimT(k,"n")).join(sep)
    };
  }).sort((a,b)=>b.v-a.v);
}

function sceneRow(sc, rank){
  const el = document.createElement("div");
  el.className = "sc-row";
  const rk = document.createElement("span");
  rk.className = "sc-rank"; rk.textContent = String(rank).padStart(2,"0");
  const dot = document.createElement("span");
  dot.className = "sc-dot";
  dot.style.background = sc.dom === "hw" ? "var(--hw)" : "var(--sw)";
  const main = document.createElement("div");
  main.className = "sc-main";
  const nm = document.createElement("span");
  nm.className = "sc-name"; nm.textContent = sc.n;
  const why = document.createElement("span");
  why.className = "sc-why"; why.textContent = t("scWhy") + sc.why;
  main.append(nm, why);
  const vv = document.createElement("span");
  vv.className = "sc-val"; vv.textContent = sc.v;
  el.append(rk, dot, main, vv);
  return el;
}

function renderScenes(res){
  const list = sceneScores(res.dims);
  const top = $("#sc-top"), bot = $("#sc-bot"), full = $("#sc-full");
  top.innerHTML = ""; bot.innerHTML = ""; full.innerHTML = "";
  list.slice(0,8).forEach((sc,i)=>top.appendChild(sceneRow(sc, i+1)));
  list.slice(-8).reverse().forEach((sc,i)=>bot.appendChild(sceneRow(sc, list.length-i)));
  full.className = "sc-full";
  list.forEach((sc,i)=>full.appendChild(sceneRow(sc, i+1)));
  return list;
}

function renderGroups(res){
  ["hw","sw"].forEach(dom=>{
    const host = $(dom === "hw" ? "#grp-hw" : "#grp-sw");
    host.innerHTML = "";
    res.groups.filter(g=>g.d===dom).forEach(g=>{
      const det = document.createElement("details");
      det.className = "gcard";
      const sum = document.createElement("summary");
      const c = dom === "hw" ? "var(--hw)" : "var(--sw)";
      sum.innerHTML =
        '<span class="g-chev">&#9654;</span>' +
        '<span class="g-name"></span>' +
        '<div class="g-track"><i style="background:'+c+'"></i></div>' +
        '<span class="g-val"></span>';
      sum.querySelector(".g-name").textContent = grpT(g.gi);
      sum.querySelector(".g-val").textContent = g.v;
      sum.querySelector(".g-track i").dataset.w = g.v;
      const body = document.createElement("div");
      body.className = "g-body";
      g.dims.forEach(k=>body.appendChild(dimRow(k, res.dims[k])));
      det.append(sum, body);
      host.appendChild(det);
    });
  });
}

function renderExtremes(res){
  const list = Object.keys(DIM).filter(k=>DIM[k].g !== "Z")
    .map(k=>({k, v:res.dims[k].v})).sort((a,b)=>b.v-a.v);
  const row = (o)=>{
    const el = document.createElement("div");
    el.className = "ex-row";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = DIM[o.k].d === "hw" ? "var(--hw)" : "var(--sw)";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = dimT(o.k,"n");
    const vv = document.createElement("span"); vv.className = "vv"; vv.textContent = o.v;
    el.append(dot, nm, vv);
    return el;
  };
  const top = $("#ex-top"), bot = $("#ex-bot");
  top.innerHTML = ""; bot.innerHTML = "";
  list.slice(0,3).forEach(o=>top.appendChild(row(o)));
  list.slice(-3).reverse().forEach(o=>bot.appendChild(row(o)));
}

function renderParams(res){
  const tags = $("#param-tags");
  tags.innerHTML = "";
  const add = (label, val, hw)=>{
    const el = document.createElement("span");
    el.className = "tag" + (hw ? " hw" : "");
    el.append(document.createTextNode(label + " "));
    const b = document.createElement("b"); b.textContent = val;
    el.appendChild(b);
    tags.appendChild(el);
  };
  add(t("tagSoma"), somaLabel(res), true);
  if(res.bmi) add(t("tagBmi"), res.bmi.toFixed(1) + "  " + t(res.bmiKey), false);
  if(res.h) add(t("tagH"), res.h + t("unitCm"), false);
  if(res.w) add(t("tagW"), res.w + t("unitKg"), false);

  const meters = $("#param-meters");
  meters.innerHTML = "";
  ["aura","voi"].forEach(k=>{
    const d = res.dims[k];
    const r = document.createElement("div");
    r.className = "meter-row";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = dimT(k,"n");
    const tr = document.createElement("div"); tr.className = "dim-track";
    const fi = document.createElement("i"); fi.style.background = "var(--hw)"; fi.dataset.w = d.v;
    tr.appendChild(fi);
    const vv = document.createElement("span"); vv.className = "dim-val"; vv.textContent = d.v;
    r.append(nm, tr, vv);
    meters.appendChild(r);
    const say = document.createElement("p");
    say.className = "dim-say"; say.style.margin = "0 0 6px 0";
    say.textContent = dimT(k, band(d.v));
    meters.appendChild(say);
    const ex = document.createElement("p");
    ex.className = "dim-ex"; ex.style.margin = "0 0 10px 0";
    ex.textContent = t("dimEx") + dimT(k,"ex");
    meters.appendChild(ex);
  });

  $("#param-note").textContent = fmt(t("parNote"), {x: t(SOMA_NOTE[res.somaLead])});
}

function renderCalib(res){
  const host = $("#calib");
  host.innerHTML = "";
  const biasTxt = res.bias > 0.35 ? t("biasHi") : (res.bias < -0.35 ? t("biasLo") : t("biasOk"));
  const biasDesc = res.bias > 0.35 ? t("biasDescHi")
    : (res.bias < -0.35 ? t("biasDescLo") : t("biasDescOk"));
  const stop = LANG === "en" ? ". " : "。";
  const cards = [
    [t("calRel"), res.reliability + " / 100",
      res.reliability >= 78 ? t("relHi") : res.reliability >= 58 ? t("relMid") : t("relLo")],
    [t("calBias"), (res.bias >= 0 ? "+" : "") + res.bias.toFixed(2), biasTxt + stop + biasDesc],
    [t("calSpread"), res.spread.toFixed(2) + t("spreadUnit"), t("spreadDesc")],
    [t("calExtreme"), Math.round(res.extremity*100) + "%",
      res.extremity > 0.75 ? t("extremeHi")
        : res.extremity > 0.5 ? t("extremeMid") : t("extremeOk")]
  ];
  cards.forEach(([k,v,d])=>{
    const el = document.createElement("div");
    el.className = "cal";
    const kk = document.createElement("span"); kk.className = "k"; kk.textContent = k;
    const vv = document.createElement("span"); vv.className = "v"; vv.textContent = v;
    const dd = document.createElement("p"); dd.className = "d"; dd.textContent = d;
    el.append(kk, vv, dd);
    host.appendChild(el);
  });
}

function renderRate(code){
  const host = $("#rate");
  host.innerHTML = "";
  const h = histLoad().find(x => x.code === code);
  const cur = h ? (h.rate || 0) : 0;
  for(let n = 1; n <= 5; n++){
    const b = document.createElement("button");
    b.textContent = n;
    b.setAttribute("aria-pressed", String(n === cur));
    b.setAttribute("aria-label", n + " / 5");
    b.onclick = ()=>setRate(code, n);
    host.appendChild(b);
  }
  $("#rate-msg").textContent = cur ? fmt(t("rateDone"), {n:cur}) : t("rateHint");
}

function setRate(code, n){
  histRate(code, n);
  renderRate(code);
  const msg = $("#rate-msg");
  if(!formReady()){ msg.textContent = fmt(t("rateDone"), {n:n}) + " " + t("rateLocal"); return; }
  sendRating(code, n)
    .then(()=>{ msg.textContent = fmt(t("rateDone"), {n:n}) + " " + t("rateSent"); })
    .catch(()=>{ msg.textContent = t("rateFail"); });
}

function finish(keepScroll){
  const res = RESULT = score();
  show("#s-result");

  const hw = res.groups.filter(g=>g.d==="hw"), sw = res.groups.filter(g=>g.d==="sw");
  const avg = a => Math.round(a.reduce((x,y)=>x+y.v,0)/a.length);
  const hwA = avg(hw), swA = avg(sw);
  const scenes = renderScenes(res);
  const judge = Math.abs(hwA-swA) < 6 ? t("judgeBal") : (hwA > swA ? t("judgeHw") : t("judgeSw"));
  $("#res-sub").textContent = fmt(t("resSub"),
    {a:hwA, b:swA, j:judge, c:scenes[scenes.length-1].n});
  $("#res-title").textContent = fmt(t("resTitle"), {x:scenes[0].n});

  RESULT_CODE = encodeAns(state.ans);
  histAdd(res, RESULT_CODE);
  $("#code-str").textContent = RESULT_CODE;
  renderRate(RESULT_CODE);
  renderHist();

  renderTitle(res);
  drawRadar(res.groups);
  renderExtremes(res);
  renderCalib(res);
  renderParams(res);
  renderGroups(res);

  requestAnimationFrame(()=>{
    document.querySelectorAll("[data-w]").forEach(el=>{ el.style.width = el.dataset.w + "%"; });
  });
  if(!keepScroll) window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- 畫面切換 ---------- */
function show(sel){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(sel).classList.add("on");
}

/* =========================================================
   綁定
   ========================================================= */
buildSegs();

const saved = load();
let savedDone = false;
if(saved && Object.keys(saved.ans).length > 0){
  savedDone = saved.i >= ALLQ.length;
  $("#btn-resume").hidden = false;
}

function applyUI(){
  document.documentElement.lang = t("htmlLang");
  document.documentElement.setAttribute("data-l", LANG);
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll(".n-scenes").forEach(el=>{ el.textContent = SCENES.length; });
  $("#spec-q").textContent = ALLQ.length;
  $("#rail-count").textContent = (state.i+1) + " / " + ALLQ.length;
  if(saved && Object.keys(saved.ans).length > 0){
    $("#btn-resume").textContent = savedDone
      ? t("btnViewLast") : fmt(t("btnResume"), {n: saved.i + 1});
  }
  renderHist();
  $("#langbar").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG));
  });
  if($("#s-quiz").classList.contains("on")) renderQ(true);
  else if($("#s-result").classList.contains("on") && RESULT) finish(true);
}

function setLang(l){
  if(!(l in PACKS)) return;
  LANG = l;
  try{ localStorage.setItem(LKEY, l); }catch(e){}
  applyUI();
}
$("#langbar").querySelectorAll("button").forEach(b=>{
  b.onclick = ()=>setLang(b.dataset.lang);
});

$("#btn-start").onclick = ()=>{ state = {i:0, ans:{}}; save(); show("#s-quiz"); renderQ(); };
$("#btn-resume").onclick = ()=>{ state = saved; if(savedDone){ finish(); } else { show("#s-quiz"); renderQ(); } };
$("#btn-back").onclick = back;
$("#btn-again").onclick = ()=>{
  state = {i:0, ans:{}}; save();
  $("#btn-resume").hidden = true;
  show("#s-intro"); window.scrollTo({top:0, behavior:"instant"});
};
$("#btn-hist").onclick = ()=>{
  renderHist();
  show("#s-intro");
  const h = $("#hist");
  if(h.hidden) window.scrollTo({top:0, behavior:"instant"});
  else h.scrollIntoView({block:"start"});
};
$("#btn-code").onclick = async ()=>{
  if(!RESULT_CODE) return;
  try{
    await navigator.clipboard.writeText(RESULT_CODE);
    $("#copy-msg").textContent = t("codeOk");
  }catch(e){
    $("#copy-msg").textContent = t("copyFail");
  }
  setTimeout(()=>{ $("#copy-msg").textContent = ""; }, 2400);
};
$("#btn-copy").onclick = async ()=>{
  if(!RESULT) return;
  const gap = LANG === "en" ? "  " : "　";
  const lines = [t("copyTitle"), "", t("copyTtl") + titleName(titleOf(RESULT)), ""];
  RESULT.groups.forEach(g=>{
    lines.push("[" + grpT(g.gi) + "] " + g.v);
    g.dims.forEach(k=>lines.push("  " + dimT(k,"n") + gap + RESULT.dims[k].v));
  });
  lines.push("", t("copySoma") + somaLabel(RESULT));
  lines.push(dimT("aura","n") + gap + RESULT.dims.aura.v);
  lines.push(dimT("voi","n") + gap + RESULT.dims.voi.v);
  lines.push(t("copyRel") + RESULT.reliability + "/100");
  const sl = sceneScores(RESULT.dims);
  lines.push("", t("copyTop5"));
  sl.slice(0,5).forEach((s,i)=>lines.push("  " + (i+1) + ". " + s.n + gap + s.v));
  lines.push(t("copyBot5"));
  sl.slice(-5).reverse().forEach((s,i)=>lines.push("  " + (i+1) + ". " + s.n + gap + s.v));
  try{
    await navigator.clipboard.writeText(lines.join("\n"));
    $("#copy-msg").textContent = t("copyOk");
  }catch(e){
    $("#copy-msg").textContent = t("copyFail");
  }
  setTimeout(()=>{ $("#copy-msg").textContent = ""; }, 2400);
};

applyUI();
</script>
